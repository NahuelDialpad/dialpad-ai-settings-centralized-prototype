<!doctype html>
<html lang="en" data-dt-theme="light" data-dt-brand="dp">

  <meta name="description" content="Explore a centralized model for governing AI across a company, its offices, and calling groups in Dialpad Admin.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f7f6f4">
  <meta property="og:title" content="Dialpad centralized AI settings — concept prototype">
  <meta property="og:description" content="A working concept for managing Company, Office, and Calling Group AI governance from one destination.">
  <meta property="og:type" content="website">
  <title>Centralized AI Settings | Dialpad concept</title>
  <style>
    :root {
      /* Dialtone Next 10 · dp-light semantic token bridge.
         Kept inline so this prototype remains a portable, single-file artifact. */
      color-scheme: light;
      --dt-font-size-root: 10px;
      --dt-font-family-body: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI Adjusted", "Segoe UI", SFMono, "Helvetica Neue", Cantarell, Ubuntu, Roboto, Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      --dt-font-weight-normal: 400;
      --dt-font-weight-medium: 500;
      --dt-font-weight-semi-bold: 600;
      --dt-font-weight-bold: 700;
      --dt-font-size-100: 12px;
      --dt-font-size-150: 14px;
      --dt-font-size-200: 16px;
      --dt-font-size-250: 18px;
      --dt-font-size-300: 20px;
      --dt-font-size-400: 26px;
      --dt-font-line-height-100: 1;
      --dt-font-line-height-200: 1.2;
      --dt-font-line-height-300: 1.4;
      --dt-font-line-height-400: 1.6;

      --dt-color-foreground-primary: oklch(0.2572 0.0063 78.21);
      --dt-color-foreground-secondary: oklch(0.3902 0.0055 67.24);
      --dt-color-foreground-tertiary: oklch(0.4747 0.0059 86.72);
      --dt-color-foreground-muted: oklch(from oklch(0.1595 0.0045 84.59) l c h / .5);
      --dt-color-foreground-disabled: oklch(0.6114 0.0032 84.56);
      --dt-color-foreground-info: oklch(0.4857 0.205 260.61);
      --dt-color-foreground-info-strong: oklch(0.4126 0.1703 260.22);
      --dt-color-foreground-positive: oklch(0.5152 0.1266 155.2);
      --dt-color-foreground-positive-strong: oklch(0.4299 0.104657 155.7992);
      --dt-color-foreground-warning: oklch(0.5888 0.138492 59.7021);
      --dt-color-foreground-warning-strong: oklch(0.418 0.096552 61.5939);
      --dt-color-foreground-critical: oklch(0.5724 0.229466 18.56);
      --dt-color-foreground-critical-strong: oklch(0.4703 0.1879 17.53);

      --dt-color-surface-primary: oklch(1 0 0);
      --dt-color-surface-secondary: oklch(0.9748 0.0025 48.72);
      --dt-color-surface-moderate: oklch(0.9245 0.0029 84.56);
      --dt-color-surface-bold: oklch(0.8448 0.0059 84.57);
      --dt-color-surface-brand-subtle: oklch(0.9514 0.0276 301.76);
      --dt-color-surface-info: oklch(0.9037 0.047 257.26);
      --dt-color-surface-info-subtle: oklch(0.9486 0.0246 257.65);
      --dt-color-surface-positive: oklch(0.961 0.0564 166.75);
      --dt-color-surface-positive-subtle: oklch(0.9766 0.0201 169.36);
      --dt-color-surface-warning: oklch(0.9436 0.0483 77.26);
      --dt-color-surface-warning-subtle: oklch(0.9818 0.0152 77.07);
      --dt-color-surface-critical: oklch(0.8774 0.0653 17.3);
      --dt-color-surface-critical-subtle: oklch(0.936 0.0322 22.46);
      --dt-color-surface-overlay: oklch(1 0 0);
      --dt-color-surface-backdrop: oklch(0 0 0 / .65);
      --dt-color-surface-primary-inverted: oklch(0.1595 0.0045 84.59);
      --dt-color-foreground-primary-inverted: oklch(1 0 0);

      --dt-color-border-subtle: oklch(from oklch(0.2572 0.0063 78.21) l c h / .11);
      --dt-color-border-default: oklch(from oklch(0.2572 0.0063 78.21) l c h / .17);
      --dt-color-border-moderate: oklch(from oklch(0.2572 0.0063 78.21) l c h / .3);
      --dt-color-border-info-subtle: oklch(0.7558 0.1259 258.28);
      --dt-color-border-positive-subtle: oklch(0.846 0.1357 162.49);
      --dt-color-border-warning-subtle: oklch(0.8585 0.122968 75.6919);
      --dt-color-border-critical-subtle: oklch(0.7713 0.1367 14.03);

      --dt-color-link-primary: oklch(0.5829 0.2426 287.41);
      --dt-color-link-primary-hover: oklch(0.4108 0.2066 284.07);
      --dt-action-color-background-base-primary-default: oklch(0.5829 0.2426 287.41);
      --dt-action-color-background-base-primary-hover: oklch(0.4831 0.2316 284.82);
      --dt-action-color-background-base-primary-active: oklch(0.4108 0.2066 284.07);
      --dt-action-color-background-base-hover: oklch(0.9 0.06 301 / .5);
      --dt-action-color-background-base-active: oklch(0.8 0.06 301 / .5);
      --dt-action-color-foreground-base-default: oklch(0.5829 0.2426 287.41);
      --dt-action-color-foreground-base-hover: oklch(0.4108 0.2066 284.07);
      --dt-action-color-foreground-base-primary-default: oklch(1 0 0);
      --dt-action-color-border-base-outlined-default: oklch(0.5829 0.2426 287.41);
      --dt-action-color-foreground-muted-default: oklch(0.4747 0.0059 86.72);
      --dt-action-color-foreground-muted-hover: oklch(0.3902 0.0055 67.24);
      --dt-action-color-background-muted-hover: oklch(from oklch(0.8448 0.0059 84.57) l c h / .45);
      --dt-action-color-border-muted-outlined-default: var(--dt-color-border-default);
      --dt-action-color-background-critical-primary-default: oklch(0.6392 0.25 15.77);
      --dt-action-color-background-critical-primary-hover: oklch(0.5724 0.229466 18.56);
      --dt-action-color-foreground-critical-primary-default: oklch(1 0 0);

      --dt-shell-color-surface-default: var(--dt-color-surface-secondary);
      --dt-shell-action-color-background-primary-hover: oklch(from oklch(0.3436 0.0055 56.21) l c h / .1);
      --dt-shell-action-color-background-primary-selected: oklch(from oklch(0.3436 0.0055 56.21) l c h / .13);
      --dt-shell-action-color-background-primary-active: oklch(from oklch(0.3436 0.0055 56.21) l c h / .16);
      --dt-shell-action-color-foreground-primary-default: oklch(from oklch(0.2572 0.0063 78.21) l c h / .86);

      --dt-checkbox-color-background-checked: var(--dt-action-color-background-base-primary-default);
      --dt-checkbox-color-border-unchecked: var(--dt-color-border-moderate);
      --dt-inputs-color-background-default: var(--dt-color-surface-primary);
      --dt-inputs-color-background-disabled: oklch(from oklch(0.8448 0.0059 84.57) l c h / .45);
      --dt-inputs-color-border-default: var(--dt-color-border-default);
      --dt-inputs-color-border-hover: var(--dt-color-border-moderate);
      --dt-inputs-color-border-focus: oklch(0.6089 0.2128 259.28);
      --dt-inputs-color-foreground-default: var(--dt-color-foreground-primary);
      --dt-inputs-color-foreground-disabled: var(--dt-color-foreground-disabled);

      --dt-badge-color-foreground-default: oklch(0.1595 0.0045 84.59);
      --dt-badge-color-background-default: oklch(from oklch(0.8448 0.0059 84.57) l c h / .45);
      --dt-badge-color-background-info: oklch(0.8437 0.0781 257.48);
      --dt-badge-color-background-positive: oklch(0.9148 0.0923 165.26);
      --dt-badge-color-background-warning: oklch(0.9018 0.0868 77.62);
      --dt-badge-color-background-critical: oklch(0.8211 0.1019 12.69);

      --dt-spacing-25: 2px;
      --dt-spacing-50: 4px;
      --dt-spacing-75: 6px;
      --dt-spacing-100: 8px;
      --dt-spacing-125: 10px;
      --dt-spacing-150: 12px;
      --dt-spacing-175: 14px;
      --dt-spacing-200: 16px;
      --dt-spacing-250: 20px;
      --dt-spacing-300: 24px;
      --dt-spacing-400: 32px;
      --dt-spacing-500: 40px;
      --dt-size-radius-circle: 50%;
      --dt-size-radius-pill: 102px;
      --dt-size-radius-300: 4px;
      --dt-size-radius-350: 6px;
      --dt-size-radius-400: 8px;
      --dt-size-radius-450: 12px;
      --dt-size-radius-500: 16px;
      --dt-shadow-small: 0 2px 4px 0 oklch(0 0 0 / .149);
      --dt-shadow-medium: 0 2px 8px 0 oklch(0 0 0 / .251);
      --dt-shadow-large: 0 2px 16px 0 oklch(0 0 0 / .302);
      --dt-shadow-focus: 0 0 0 2px var(--dt-inputs-color-border-focus) inset;

      /* Backward-compatible aliases used by the prototype's existing logic. */
      --purple: var(--dt-action-color-background-base-primary-default);
      --purple-dark: var(--dt-action-color-background-base-primary-active);
      --purple-soft: var(--dt-color-surface-brand-subtle);
      --text: var(--dt-color-foreground-primary);
      --muted: var(--dt-color-foreground-secondary);
      --tertiary: var(--dt-color-foreground-tertiary);
      --line: var(--dt-color-border-subtle);
      --line-strong: var(--dt-color-border-default);
      --shell: var(--dt-shell-color-surface-default);
      --selected: var(--dt-shell-action-color-background-primary-selected);
      --white: var(--dt-color-surface-primary);
      --warning: var(--dt-color-surface-warning);
      --warning-border: var(--dt-color-border-warning-subtle);
      --warning-text: var(--dt-color-foreground-warning-strong);
      --blue-soft: var(--dt-badge-color-background-info);
      --blue-text: var(--dt-color-foreground-info-strong);
      --green-soft: var(--dt-badge-color-background-positive);
      --green-text: var(--dt-color-foreground-positive-strong);
      --red-soft: var(--dt-badge-color-background-critical);
      --red-text: var(--dt-color-foreground-critical-strong);
      --disabled-text: var(--dt-color-foreground-disabled);
      --disabled-muted: var(--dt-color-foreground-disabled);
      --disabled-control: var(--dt-color-surface-bold);
      --disabled-surface: var(--dt-inputs-color-background-disabled);
      --shadow: var(--dt-shadow-large);
      --rail: 48px;
      --nav: 232px;
    }

    * { box-sizing: border-box; }
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    html { font-size: var(--dt-font-size-root); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--white);
      font-family: var(--dt-font-family-body);
      font-size: var(--dt-font-size-150);
      line-height: var(--dt-font-line-height-300);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: var(--dt-color-link-primary); }
    a:hover { color: var(--dt-color-link-primary-hover); }
    h1, h2, h3, h4, p { margin: 0; }
    h1 { font-size: var(--dt-font-size-400); line-height: var(--dt-font-line-height-200); letter-spacing: -.015em; }
    h2 { font-size: var(--dt-font-size-200); line-height: var(--dt-font-line-height-300); }
    h3 { font-size: var(--dt-font-size-150); line-height: var(--dt-font-line-height-300); }

    .skip-link {
      position: fixed;
      top: -60px;
      left: 58px;
      z-index: 300;
      padding: 9px 12px;
      border: 1px solid var(--dt-action-color-border-base-outlined-default);
      border-radius: var(--dt-size-radius-400);
      background: var(--dt-color-surface-primary);
      font-weight: var(--dt-font-weight-semi-bold);
    }
    .skip-link:focus { top: 10px; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: calc(var(--rail) + var(--nav)) minmax(0, 1fr);
    }

    .global-shell {
      position: fixed;
      inset: 0 auto 0 0;
      width: calc(var(--rail) + var(--nav));
      display: grid;
      grid-template-columns: var(--rail) var(--nav);
      background: var(--shell);
      border-right: 1px solid var(--line);
      z-index: 30;
    }

    .icon-rail {
      min-width: 0;
      padding: 10px 7px;
      border-right: 1px solid var(--dt-color-border-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 31px;
      height: 31px;
      margin-bottom: 20px;
      border: 0;
      border-radius: 8px 8px 8px 3px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, #9a35d7, #f52d79 68%, #ff982e);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .rail-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--dt-color-foreground-secondary);
      cursor: pointer;
    }
    .rail-button:hover { background: var(--dt-shell-action-color-background-primary-hover); }
    .rail-button.active { background: var(--dt-shell-action-color-background-primary-active); color: var(--dt-shell-action-color-foreground-primary-default); }
    .rail-button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .rail-spacer { flex: 1; }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: #d9c9ba;
      color: #513b30;
      font-size: 11px;
      font-weight: 800;
    }

    .entity-nav {
      min-width: 0;
      padding: 15px 12px 24px;
      overflow-y: auto;
    }
    .company-name {
      height: 31px;
      padding: 2px 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .collapse-mark { color: var(--tertiary); font-size: 13px; }
    .nav-utility {
      width: 100%;
      height: 34px;
      margin-top: 6px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .nav-utility:hover { background: var(--dt-shell-action-color-background-primary-hover); }
    .nav-utility svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .shortcut { margin-left: auto; color: var(--tertiary); font-size: 12px; }
    .nav-section { margin-top: 20px; }
    .nav-section-label { padding: 0 8px 5px; color: var(--dt-color-foreground-disabled); font-size: var(--dt-font-size-100); }
    .entity-button {
      width: 100%;
      min-height: 32px;
      padding: 6px 9px;
      border: 0;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .entity-button:hover { background: var(--dt-shell-action-color-background-primary-hover); }
    .entity-button[aria-current="page"] { background: var(--selected); font-weight: var(--dt-font-weight-semi-bold); }

    .main {
      grid-column: 2;
      min-width: 0;
      min-height: 100vh;
      padding: 24px 25px 96px;
      background: var(--dt-color-surface-primary);
    }

    .breadcrumbs {
      min-height: 25px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: var(--dt-font-size-100);
    }
    .crumb-arrow {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      border-radius: 4px;
      color: var(--dt-color-foreground-secondary);
      cursor: pointer;
    }
    .crumb-arrow .btn-icon { margin: 0; vertical-align: 0; }
    .crumb-arrow:hover { background: var(--dt-shell-action-color-background-primary-hover); }
    .crumb-sep { color: var(--dt-color-foreground-disabled); font-size: 16px; }
    .crumb-current { color: var(--text); font-weight: 600; }

    .page-head {
      min-height: 47px;
      margin-bottom: 13px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }
    .page-head p { margin-top: 3px; color: var(--muted); }
    .page-actions { display: flex; align-items: center; gap: 9px; }

    .btn {
      min-height: 34px;
      padding: var(--dt-spacing-75) var(--dt-spacing-150);
      border: 1px solid var(--dt-action-color-border-muted-outlined-default);
      border-radius: var(--dt-size-radius-400);
      background: transparent;
      color: var(--dt-action-color-foreground-muted-default);
      font-size: var(--dt-font-size-150);
      font-weight: var(--dt-font-weight-medium);
      line-height: var(--dt-font-line-height-200);
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .btn-icon { width: 14px; height: 14px; margin-right: var(--dt-spacing-50); vertical-align: -2px; fill: currentColor; }
    .btn:hover:not(:disabled) { background: var(--dt-action-color-background-muted-hover); color: var(--dt-action-color-foreground-muted-hover); }
    .btn.primary { border-color: transparent; background: var(--dt-action-color-background-base-primary-default); color: var(--dt-action-color-foreground-base-primary-default); }
    .btn.primary:hover:not(:disabled) { background: var(--dt-action-color-background-base-primary-hover); color: var(--dt-action-color-foreground-base-primary-default); }
    .btn.link { border-color: transparent; background: transparent; color: var(--dt-action-color-foreground-base-default); }
    .btn.link:hover:not(:disabled) { background: var(--dt-action-color-background-base-hover); color: var(--dt-action-color-foreground-base-hover); }
    .btn.danger { border-color: transparent; background: var(--dt-action-color-background-critical-primary-default); color: var(--dt-action-color-foreground-critical-primary-default); }
    .btn.danger:hover:not(:disabled) { background: var(--dt-action-color-background-critical-primary-hover); color: var(--dt-action-color-foreground-critical-primary-default); }
    .btn:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }

    .detail-layout {
      display: grid;
      grid-template-columns: 205px minmax(0, 920px);
      gap: 26px;
      align-items: start;
    }
    .secondary-nav {
      position: sticky;
      top: 16px;
      padding-top: 7px;
    }
    .secondary-button {
      width: 100%;
      min-height: 34px;
      padding: 7px 11px;
      border: 0;
      border-radius: var(--dt-size-radius-400);
      background: transparent;
      color: var(--dt-color-foreground-secondary);
      text-align: left;
      cursor: pointer;
    }
    .secondary-button:hover { background: var(--dt-shell-action-color-background-primary-hover); }
    .secondary-button[aria-current="page"] { background: var(--selected); color: var(--text); font-weight: var(--dt-font-weight-semi-bold); }
    .secondary-group { margin: 1px 0; }
    .secondary-button.context-active { color: var(--text); font-weight: var(--dt-font-weight-semi-bold); }
    .secondary-subnav {
      margin: 0 0 4px 12px;
      padding-left: 9px;
      border-left: 1px solid var(--dt-color-border-default);
    }
    .secondary-button.subitem {
      min-height: 30px;
      padding-block: 5px;
      font-size: var(--dt-font-size-100);
    }

    .settings-pane { min-width: 0; }
    .settings-section {
      padding: var(--dt-spacing-300) 0;
      border-bottom: 1px solid var(--line);
    }
    .settings-section:first-child { padding-top: 6px; }
    .settings-section:last-child { border-bottom: 0; }
    .ai-dependent.ai-disabled,
    .setting-row.ai-disabled,
    .table-state.ai-disabled { color: var(--disabled-text); }
    .ai-dependent.ai-disabled > .section-heading h2,
    .ai-dependent.ai-disabled .setting-copy strong,
    .ai-dependent.ai-disabled .agent-row strong,
    .ai-dependent.ai-disabled .agent-name,
    .setting-row.ai-disabled .setting-copy strong { color: var(--disabled-text); }
    .ai-dependent.ai-disabled > .section-heading p,
    .ai-dependent.ai-disabled .setting-copy p,
    .ai-dependent.ai-disabled .agent-row small,
    .setting-row.ai-disabled .setting-copy p,
    .table-state.ai-disabled small { color: var(--disabled-muted); }
    .ai-dependent.ai-disabled .agent-table {
      border-color: var(--dt-color-border-subtle);
      background: var(--dt-color-surface-secondary);
    }
    .ai-dependent.ai-disabled .agent-row { border-color: var(--dt-color-border-subtle); }
    .section-heading { margin-bottom: 16px; }
    .section-heading p { max-width: 730px; margin-top: 4px; color: var(--muted); }

    .setting-row {
      min-height: 50px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 28px;
    }
    .setting-row + .setting-row { margin-top: 17px; }
    .setting-copy { max-width: 720px; }
    .central-shell .company-ai-pane .setting-row {
      width: 100%;
      max-width: 820px;
    }
    .setting-copy strong { display: block; font-size: var(--dt-font-size-150); font-weight: var(--dt-font-weight-semi-bold); }
    .setting-copy p { margin-top: 4px; color: var(--muted); }
    .setting-meta { margin-top: 7px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .setting-actions {
      min-width: 148px;
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;

          "<div class='table-footer'><span>Show <select class='select' aria-label='Keywords per page'><option>25</option></select></span><span id='dictionaryCount'>" + dictionaryResultLabel() + "　‹　1　›</span></div>" +
        "</div>";
      }

      function placeholderDetail(scope, tab) {
        return "<div class='settings-pane'><div class='placeholder'><h2>" + esc(tabLabel(tab)) + "</h2><p>" + esc(scope) + " uses the existing Dialpad settings experience here. This prototype only expands the AI Settings path.</p><button class='btn primary' style='margin-top:18px' data-action='navigate-tab' data-tab='ai-settings'>Open AI Settings</button></div></div>";
      }
      function tabLabel(tab) {
        return ({ overview: "Overview", holidays: "Holidays", "company-dictionary": "Company Dictionary", departments: "Departments", "contact-centers": "Contact Centers", "coaching-teams": "Coaching Teams", quality: "Quality of Service", hours: "Hours and Routing", alerts: "Dashboard and Alerts", advanced: "Advanced Settings", admins: "Agents and Admins", skills: "Skills", powerdialer: "Powerdialer", calling: "Calling", devices: "Devices", permissions: "Permissions" })[tab] || "Settings";
      }

      function renderCompany() {
        document.getElementById("breadcrumbs").innerHTML = breadcrumbHtml(["Admin settings", "Company"]);
        var content = pageHead("Company", "", changeLogAction());
        var body = state.route.tab === "ai-settings" ? companyAiHtml() : state.route.tab === "company-dictionary" ? companyDictionaryHtml() : state.route.tab === "overview" ? companyOverviewHtml() : placeholderDetail("Company", state.route.tab);
        content += "<div class='detail-layout'>" + companySecondary() + body + "</div>";
        return content;
      }

      function renderOfficeList() {
        var rows = state.offices.map(function (office) {
          var eff = officeMasterEffective(office);
          var disabled = !state.company.aiMaster;
          var displayedValue = disabled ? office.aiMaster : eff.on;
          var availability = disabled ? "Company AI off · Saved " + (office.aiMaster ? "on" : "off") : "";
          var sharingDisabled = !state.company.dataSharing || !eff.on;
          var sharingReason = !state.company.dataSharing ? "Unavailable because Data sharing is off company-wide." : !eff.on ? "Available when AI is on for this Office." : "";
          var sharingLabel = "Share data with Dialpad for " + office.name + (sharingReason ? ". " + sharingReason : "");
          var managementHelp = "When locked, Office Admins can view this Office’s AI settings but can’t modify them.";
          var managementState = office.aiManagement
            ? "<span class='management-state allowed'>Allowed</span>"
            : "<span class='management-state locked' tabindex='0' data-management-tooltip='" + esc(managementHelp) + "' aria-describedby='managementTooltip'>Locked <i class='management-mark' aria-hidden='true'>ⓘ</i></span>";
          return "<tr><td>" + squareHtml("select-row", false, false, "Select " + office.name, "data-office='" + office.id + "'") + "</td>" +
            "<td><button class='entity-link' data-action='open-office' data-office='" + office.id + "'>" + esc(office.name) + "</button></td><td>" + esc(office.location) + "</td><td>" + office.users + "</td>" +
            "<td>" + squareHtml("noop", true, false, "Call recording") + "</td><td>" + squareHtml("noop", office.id !== "ny", false, "Recording management") + "</td>" +
            "<td><div class='table-state" + (disabled ? " ai-disabled" : "") + "'>" + squareHtml("toggle-office-master", displayedValue, disabled, "AI availability for " + office.name, "data-office='" + office.id + "'") + (availability ? "<small>" + esc(availability) + "</small>" : "") + "</div></td>" +
            "<td><div class='management-control'>" + squareHtml("toggle-office-management", office.aiManagement, false, "Allow Office Admins to manage AI settings for " + office.name, "data-office='" + office.id + "'") + managementState + "</div></td>" +
            "<td><div class='office-setting-control" + (sharingDisabled ? " ai-disabled" : "") + "'>" + squareHtml("toggle-office-data-sharing", office.dataSharing, sharingDisabled, sharingLabel, "data-office='" + office.id + "'") + "<span class='office-setting-state'>" + (office.dataSharing ? "On" : "Off") + "</span></div></td></tr>";
        }).join("");
        document.getElementById("breadcrumbs").innerHTML = breadcrumbHtml(["Admin settings", "Offices"]);
        return pageHead("Office Management", "", "<button class='btn' data-action='noop'>" + dtIcon("download") + "Export</button><button class='btn primary' data-action='noop'>" + dtIcon("plus") + "Add office</button>") +
          "<div class='toolbar'><input class='search' placeholder='Search offices' aria-label='Search offices'><select class='select' aria-label='Filter offices by call recording'><option>Call recording</option></select><select class='select' aria-label='Filter offices by AI features'><option>AI features</option></select><select class='select' aria-label='Filter offices by AI management'><option>AI management</option></select></div>" +
          "<div class='table-shell'><div class='table-wrap'><table class='office-table'><caption class='visually-hidden'>Offices and their calling and AI settings</caption><colgroup><col class='office-select-col'><col class='office-name-col'><col class='office-location-col'><col class='office-users-col'><col class='office-setting-col'><col class='office-setting-col'><col class='office-setting-col'><col class='office-setting-col'><col class='office-setting-col'></colgroup><thead><tr><th></th><th>Office</th><th>Location</th><th>Users</th><th>Call recording</th><th><span aria-hidden='true'>Rec management</span><span class='visually-hidden'>Recording management</span></th><th>AI features</th><th>AI management</th><th><span class='column-help' tabindex='0' data-management-tooltip='Share eligible conversation data with Dialpad to improve Dialpad AI.' aria-describedby='managementTooltip'>Data sharing <i class='management-mark' aria-hidden='true'>ⓘ</i></span></th></tr></thead><tbody>" + rows + "</tbody></table></div></div>" +
          "<div class='table-footer'><span>Show <select class='select' aria-label='Offices per page'><option>25</option></select></span><span>Showing 1–" + state.offices.length + " of " + state.offices.length + "　‹　1　›</span></div>";
      }

      function renderUserList() {
        var rows = state.users.map(function (user) {
          var office = getOffice(user.officeId);
          var eff = userAiEffective(user);
          var parentAllows = userAiParentAllows(user);
          var savedState = user.aiMaster ? "on" : "off";
          var status = parentAllows ? "" : eff.reason + " · Saved " + savedState;
          return "<tr><td><button class='entity-link' data-action='open-user' data-user='" + user.id + "'>" + esc(user.name) + "</button></td>" +
            "<td>" + esc(user.email) + "</td><td>" + esc(office ? office.short : "Unassigned") + "</td><td>" + esc(user.role) + "</td>" +
            "<td><div class='table-state" + (!parentAllows ? " ai-disabled" : "") + "'>" + squareHtml("toggle-user-ai", parentAllows ? eff.on : user.aiMaster, !parentAllows, "AI availability for " + user.name, "data-user='" + user.id + "'") + (status ? "<small>" + esc(status) + "</small>" : "") + "</div></td></tr>";
        }).join("");
        document.getElementById("breadcrumbs").innerHTML = breadcrumbHtml(["Admin settings", "Users"]);
        return pageHead("Users", "", "<button class='btn' data-action='noop'>" + dtIcon("download") + "Export</button><button class='btn primary' data-action='noop'>" + dtIcon("plus") + "Add user</button>") +
          "<div class='toolbar'><input class='search' placeholder='Search users' aria-label='Search users'><select class='select' aria-label='Filter users by Office'><option>All Offices</option></select><select class='select' aria-label='Filter users by AI features'><option>AI features</option></select></div>" +
          "<div class='table-shell'><div class='table-wrap'><table class='user-table'><caption class='visually-hidden'>Users and their personal AI settings</caption><colgroup><col class='user-name-col'><col class='user-email-col'><col class='user-office-col'><col class='user-role-col'><col class='user-ai-col'></colgroup><thead><tr><th>User</th><th>Email</th><th>Office</th><th>Role</th><th>AI features</th></tr></thead><tbody>" + rows + "</tbody></table></div></div>" +
          "<div class='table-footer'><span>Show <select class='select' aria-label='Users per page'><option>25</option></select></span><span>Showing 1–" + state.users.length + " of " + state.users.length + "　‹　1　›</span></div>";
      }

      function userAiHtml(user) {
        var office = getOffice(user.officeId);
        var eff = userAiEffective(user);
        var parentAllows = userAiParentAllows(user);
        var meta = parentAllows
          ? badge(eff.on ? "Available for personal calls" : "Personal AI is off", eff.on ? "allowed" : "")
          : badge(eff.reason, "disabled") + badge("Saved: " + (user.aiMaster ? "On" : "Off"), "disabled");
        return "<div class='settings-pane'>" +
          "<section class='settings-section'><div class='setting-row" + (!parentAllows ? " ai-disabled" : "") + "'><div class='setting-copy'><strong>Allow AI to be used for this user’s personal calls</strong><p>Enables real-time transcription and supported Conversation AI features for this user’s personal calls. Calling group AI settings are managed separately.</p><div class='setting-meta'>" + meta + "</div></div>" +
          switchHtml("toggle-user-ai", user.aiMaster, !parentAllows, "Personal AI availability for " + user.name, "data-user='" + user.id + "'") + "</div></section>" +
          "<section class='settings-section'><div class='section-heading'><h2>What this setting controls</h2><p>When available, personal calls can use live transcription, summaries and recaps, and other supported Conversation AI experiences. Company and Office settings remain the ceiling.</p></div></section>" +
        "</div>";
      }

      function renderUserDetail(user) {
        var office = getOffice(user.officeId);
        document.getElementById("breadcrumbs").innerHTML = breadcrumbHtml(["Admin settings", "Users", user.name]);
        var body = state.route.tab === "ai-settings" ? userAiHtml(user) : placeholderDetail(user.name, state.route.tab);
        return pageHead(user.name, user.email + (office ? " · " + office.name : ""), changeLogAction()) + "<div class='detail-layout'>" + userSecondary() + body + "</div>";
      }

      function officeAiHtml(office, options) {
        options = options || {};
        var master = officeMasterEffective(office);
        var agents = agentsForScope(office.id);
        var managementLock = options.centralized ? null : aiManagementLockFor("offices", office);
        var disabledByCompany = !state.company.aiMaster;
        var noCompanyCapabilities = !state.company.conversation && !state.company.agentic;
        var masterDisabled = disabledByCompany || (!office.aiMaster && noCompanyCapabilities);
        var officeAvailability = disabledByCompany ? "Available when company-wide AI is on" : "Available when AI is on for this Office";
        var masterMeta = masterDisabled ? "<div class='setting-meta'>" + badge(disabledByCompany ? "Unavailable because company-wide AI is off" : "No AI capabilities are available company-wide", "disabled") + "</div>" : "";
        return "<div class='settings-pane'>" +
          (managementLock ? aiManagementLockBanner(managementLock, "aiManagementLockNotice") : "") +
          "<section class='settings-section'><div class='setting-row" + (masterDisabled ? " ai-disabled" : "") + "'><div class='setting-copy'><strong>Allow AI to be used in this Office</strong><p>Sets the maximum AI access for this Office. When turned off, Conversation AI and AI agents &amp; assistants are unavailable for its users, groups, shared lines, and Agent deployments. Saved lower-level settings are preserved.</p>" + masterMeta + "</div>" + switchHtml("toggle-office-master", office.aiMaster, masterDisabled, "Office AI availability", "data-office='" + office.id + "'") + "</div></section>" +
          "<section class='" + aiSectionClass(!master.on) + "'><div class='section-heading'><h2>Advanced controls</h2><p>Manage each AI capability separately for this Office. Turning one off makes it unavailable to groups and shared lines in this Office. Company settings remain the ceiling.</p></div>" +
            officeFamilyRow(office, "conversation", master) +
            officeFamilyRow(office, "agentic", master) +
          "</section>" +
          officeDataSharingSection(office, master) +
          officeDefaultPreferences(office) +
          (options.centralized ? centralOfficeAgentVisibilitySection(office, agents) : officeAgentDeploymentSection(office, agents)) +
          piiOfficeSection(office) +
          voicemailSection(office, null) +
          "<section class='" + aiSectionClass(!master.on) + "'><div class='section-heading'><h2>Shared lines</h2><p>Shared lines follow this Office’s AI availability and cannot override it. Saved shared-line settings are preserved when Office AI is off.</p></div><div class='setting-row" + (!master.on ? " ai-disabled" : "") + "'><div class='setting-copy'><strong>" + esc(office.mainLine.name) + "</strong><p>Uses this Office’s AI settings. PII redaction is not currently supported for Main Lines.</p></div>" + (master.on ? badge("Uses Office AI settings", "inherited") : badge(officeAvailability, "disabled")) + "</div></section>" +
        "</div>";
      }

      function officeDataSharingSection(office, master) {
        var companyAllows = state.company.dataSharing;
        var disabled = !master.on || !companyAllows;
        var reason = !companyAllows ? "Unavailable because Data sharing is off company-wide" : !master.on ? "Available when AI is on for this Office" : "";
        var meta = reason ? "<div class='setting-meta'>" + badge(reason, "disabled") + "</div>" : "";
        return "<section class='" + aiSectionClass(disabled) + "'><div class='section-heading'><h2>Data sharing</h2><p>Manage Data sharing for this Office. Company settings remain the ceiling.</p></div>" +
          "<div class='setting-row" + (disabled ? " ai-disabled" : "") + "'><div class='setting-copy'><strong>Share eligible conversation data with Dialpad</strong><p>Allow Dialpad to use eligible conversation data from this Office to improve transcription accuracy and Dialpad AI. This does not affect access to AI features, and the choice is preserved when Office AI is off.</p>" + meta + "</div>" + switchHtml("toggle-office-data-sharing", office.dataSharing, disabled, "Share eligible conversation data for " + office.name, "data-office='" + office.id + "'") + "</div></section>";
      }

      function officeDefaultPreferences(office) {
        var enabled = officeFamilyEffective(office, "conversation").on;
        return "<section class='" + aiSectionClass(!enabled) + "'><div class='section-heading'><h2>Default preferences</h2><p>Defaults apply to new users and entities without altering existing saved configurations." + (!enabled ? " Available when Conversation AI is on." : "") + "</p></div><div class='pii-options'>" +
          checkboxLine("toggle-office-default-preference", office.defaultPreferences.autoStart, !enabled, "Automatically start AI for calls", "", "data-office='" + office.id + "' data-preference='autoStart'") +
          checkboxLine("toggle-office-default-preference", office.defaultPreferences.openTranscript, !enabled, "Automatically open Live Transcript when a call starts", "", "data-office='" + office.id + "' data-preference='openTranscript'") +
          checkboxLine("toggle-office-default-preference", office.defaultPreferences.allowUserControl, !enabled, "Allow users to start and stop AI during calls and meetings", "", "data-office='" + office.id + "' data-preference='allowUserControl'") +
          "</div></section>";
      }

      function officeAgentInventoryMetrics(agents) {
        var agentIds = {};
        var callingGroups = {};
        agents.forEach(function (agent) {
          agentIds[agent.id] = true;
          callingGroups[agent.groupType + ":" + agent.groupId] = true;
        });
        return {
          agents: Object.keys(agentIds).length,
          deployments: agents.length,
          callingGroups: Object.keys(callingGroups).length
        };
      }

      function officeAgentMetrics(agents) {
        var metrics = officeAgentInventoryMetrics(agents);
        var statuses = { active: 0, blocked: 0, setup: 0, disabled: 0, paused: 0 };
        agents.forEach(function (agent) {
          var kind = agentEffective(agent).kind;
          statuses[kind] = (statuses[kind] || 0) + 1;
        });
        metrics.statuses = statuses;
        return metrics;
      }

      function agentStatusBadgeKind(kind) {
        return kind === "active" ? "allowed" : kind === "blocked" ? "blocked" : kind === "setup" ? "setup" : kind === "disabled" ? "disabled" : "";
      }

      function agentStatusSummaryHtml(metrics) {
        if (!metrics.deployments) return "<span class='tertiary'>No deployments to evaluate</span>";
        var statuses = [
          { kind: "active", label: "active", always: true },
          { kind: "blocked", label: "blocked", always: true },
          { kind: "setup", label: "need setup", singular: "needs setup", always: true },
          { kind: "disabled", label: "unavailable" },
          { kind: "paused", label: "paused" }
        ];
        return statuses.filter(function (status) {
          return status.always || metrics.statuses[status.kind];
        }).map(function (status) {
          var count = metrics.statuses[status.kind] || 0;
          var label = count === 1 && status.singular ? status.singular : status.label;
          return badge(count + " " + label, agentStatusBadgeKind(status.kind));
        }).join("");
      }

      function officeAgentDeploymentSection(office, agents) {
        var metrics = officeAgentMetrics(agents);
        return "<section class='settings-section'><div class='section-heading'><h2>AI Agent deployments</h2><p>Review AI Agents assigned to calling groups in this Office. A deployment is one Agent assigned to one calling group.</p></div>" +
          "<div class='agent-summary'><dl class='agent-summary-metrics' aria-label='AI Agent deployment summary for " + esc(office.name) + "'>" +
            "<div class='agent-summary-stat'><dt>Agents</dt><dd>" + metrics.agents + "</dd></div>" +
            "<div class='agent-summary-stat'><dt>Deployments</dt><dd>" + metrics.deployments + "</dd></div>" +
            "<div class='agent-summary-stat'><dt>Calling groups</dt><dd>" + metrics.callingGroups + "</dd></div>" +
          "</dl><div class='agent-summary-foot'><div class='agent-status-summary'>" + agentStatusSummaryHtml(metrics) + "</div>" +
          "<button class='btn' data-action='open-office-agent-deployments' data-office='" + office.id + "' aria-label='View " + metrics.deployments + " AI Agent deployments for " + esc(office.name) + "'>View deployments</button></div></div></section>";
      }

      function centralOfficeAgentVisibilitySection(office, agents) {
        var metrics = officeAgentInventoryMetrics(agents);
        var rows = agents.map(function (agent) {
          var group = getGroup(agent.groupType, agent.groupId);
          return "<tr><td><strong>" + esc(agent.name) + "</strong><small>" + esc(agent.channel) + "</small></td><td>" + esc(group ? group.name : "Unassigned") + "<small>" + esc(TYPES[agent.groupType] ? TYPES[agent.groupType].singular : "Calling Group") + "</small></td></tr>";
        }).join("");
        return "<section class='settings-section'><div class='section-heading'><h2>AI Agent deployment visibility</h2><p>The AI agents &amp; assistants setting above controls availability for every deployment shown here. This inventory is read-only; manage Agent configuration, routing, connectors, credentials, licensing, and permissions in their authoritative tools.</p></div>" +
          "<div class='agent-summary'><dl class='agent-summary-metrics' aria-label='AI Agent deployment summary for " + esc(office.name) + "'><div class='agent-summary-stat'><dt>Agents</dt><dd>" + metrics.agents + "</dd></div><div class='agent-summary-stat'><dt>Deployments</dt><dd>" + metrics.deployments + "</dd></div><div class='agent-summary-stat'><dt>Calling groups</dt><dd>" + metrics.callingGroups + "</dd></div></dl></div>" +
          "<div class='table-shell' style='margin-top:12px'><div class='table-wrap'><table class='deployment-table'><caption class='visually-hidden'>Read-only AI Agent deployment visibility in " + esc(office.name) + "</caption><thead><tr><th>Agent</th><th>Calling group</th></tr></thead><tbody>" + (rows || "<tr><td colspan='2'>No AI Agent deployments are assigned to this Office.</td></tr>") + "</tbody></table></div></div></section>";
      }

      function ensureAgentInventory(officeId, preserve) {
        if (!state.agentInventory || !preserve || state.agentInventory.officeId !== officeId) {
          state.agentInventory = { officeId: officeId, query: "", status: "all", groupType: "all", page: 1, pageSize: 25 };
        }
        return state.agentInventory;
      }

      function filteredOfficeAgentDeployments(office) {
        var filters = ensureAgentInventory(office.id, true);
        var query = filters.query.trim().toLowerCase();
        return agentsForScope(office.id).filter(function (agent) {
          var group = getGroup(agent.groupType, agent.groupId);
          var status = agentEffective(agent).kind;
          var searchable = [agent.name, agent.id, agent.channel, group ? group.name : "", TYPES[agent.groupType] ? TYPES[agent.groupType].singular : ""].join(" ").toLowerCase();
          return (!query || searchable.indexOf(query) >= 0) &&
            (filters.status === "all" || filters.status === status) &&
            (filters.groupType === "all" || filters.groupType === agent.groupType);
        });
      }

      function officeAgentDeploymentPage(office) {
        var filters = ensureAgentInventory(office.id, true);
        var filtered = filteredOfficeAgentDeployments(office);
        var pageCount = Math.max(1, Math.ceil(filtered.length / filters.pageSize));
        filters.page = Math.min(Math.max(1, filters.page), pageCount);
        var start = (filters.page - 1) * filters.pageSize;
        return {
          items: filtered.slice(start, start + filters.pageSize),
          total: filtered.length,
          start: filtered.length ? start + 1 : 0,
          end: Math.min(start + filters.pageSize, filtered.length),
          page: filters.page,
          pageCount: pageCount
        };
      }

      function officeAgentDeploymentRowsHtml(office, page) {
        if (!page.items.length) return "<tr><td colspan='4'><div class='dictionary-empty'>No deployments match these filters.</div></td></tr>";
        return page.items.map(function (agent) {
          var group = getGroup(agent.groupType, agent.groupId);
          var effective = agentEffective(agent);
          var groupType = TYPES[agent.groupType] ? TYPES[agent.groupType].singular : "Calling group";
          return "<tr><td><strong>" + esc(agent.name) + "</strong><small>" + esc(agent.channel) + " · AgentID " + esc(agent.id) + "</small></td>" +
            "<td><strong>" + esc(group ? group.name : "Unknown group") + "</strong><small>" + esc(groupType) + "</small></td>" +
            "<td class='status-cell'>" + badge(effective.label, agentStatusBadgeKind(effective.kind)) + "<small>" + esc(effective.reason) + "</small></td>" +
            "<td><button class='btn' data-action='open-agent' data-agent='" + agent.id + "' data-return-office='" + office.id + "'>Review</button></td></tr>";
        }).join("");
      }

      function setPageButtonState(button, disabled) {
        if (!button) return;
        button.disabled = disabled;
        button.setAttribute("aria-disabled", disabled ? "true" : "false");
      }

      function updateOfficeAgentDeploymentResults(officeId) {
        var office = getOffice(officeId);
        if (!office) return;
        var page = officeAgentDeploymentPage(office);
        var rows = document.getElementById("officeAgentDeploymentRows");
        var count = document.getElementById("officeAgentDeploymentCount");
        if (rows) rows.innerHTML = officeAgentDeploymentRowsHtml(office, page);
        if (count) count.textContent = page.total ? "Showing " + page.start + "–" + page.end + " of " + page.total : "Showing 0 of 0";
        setPageButtonState(document.querySelector("[data-action='agent-deployments-page'][data-direction='prev']"), page.page <= 1);
        setPageButtonState(document.querySelector("[data-action='agent-deployments-page'][data-direction='next']"), page.page >= page.pageCount);
      }

      function officeAgentDeploymentsDrawerHtml(office) {
        var filters = ensureAgentInventory(office.id, true);
        var allAgents = agentsForScope(office.id);
        var metrics = officeAgentMetrics(allAgents);
        var page = officeAgentDeploymentPage(office);
        var managementLock = aiManagementLockFor("offices", office);
        var subtitle = metrics.deployments + " deployment" + (metrics.deployments === 1 ? "" : "s") + " across " + metrics.callingGroups + " calling group" + (metrics.callingGroups === 1 ? "" : "s");
        return "<div class='drawer-head'><div><h2 id='drawerTitle'>AI Agent deployments</h2><p>" + esc(office.name) + " · " + esc(subtitle) + "</p></div><button class='icon-button' data-action='close-drawer' aria-label='Close'>×</button></div>" +
          "<div class='drawer-body'>" + (managementLock ? aiManagementLockBanner(managementLock, "drawerAiManagementLockNotice") : "") + "<div class='deployment-inventory'>" +
            "<div class='deployment-toolbar'>" +
              "<label class='deployment-field'><span>Search</span><input class='search' value='" + esc(filters.query) + "' placeholder='Search agents or calling groups' data-action='agent-deployment-query' data-office='" + office.id + "'></label>" +
              "<label class='deployment-field'><span>Group type</span><select class='select' data-action='agent-deployment-type' data-office='" + office.id + "'><option value='all' " + (filters.groupType === "all" ? "selected" : "") + ">All group types</option><option value='departments' " + (filters.groupType === "departments" ? "selected" : "") + ">Departments</option><option value='contact-centers' " + (filters.groupType === "contact-centers" ? "selected" : "") + ">Contact Centers</option><option value='coaching-teams' " + (filters.groupType === "coaching-teams" ? "selected" : "") + ">Coaching Teams</option></select></label>" +

      function piiOfficeSection(office) {
        var pii = piiFor(office, null);
        var convo = officeFamilyEffective(office, "conversation");

          "<div class='setting-row'><div class='setting-copy'><strong>Enable PII redaction</strong><p>Removes supported personally identifiable information from the selected artifacts.</p></div>" + switchHtml("toggle-pii", office.pii.enabled, false, "Enable Office PII redaction", "data-office='" + office.id + "'") + "</div>" +
          "<div class='pii-options'>" +
            checkboxLine("toggle-pii-artifact", office.pii.transcripts, !office.pii.enabled || !convo.on, "AI transcripts", convo.on ? "Protection can run for supported future transcripts." : "Available when Conversation AI is on.", "data-office='" + office.id + "' data-artifact='transcripts'") +

          "<div class='pii-side'><div><strong>AI transcripts</strong> · " + (pii.transcriptActive ? "Protection active" : "Protection inactive") + "</div><div><strong>Audio recordings</strong> · " + (pii.audioActive ? "Protection active" : "Protection inactive") + "</div><div><strong>Agentic conversations</strong> · Not supported by current PII settings</div></div></section>";

      function piiCategories(office, group) {
        var config = group && group.pii ? group.pii : office.pii;

          control = "<div class='setting-actions'>" + switchHtml("set-voicemail", displayedOn, disabled, "Transcribe new voicemails for " + group.name, attrs + " data-value='" + (displayedOn ? "block" : "allow") + "'") + defaultButton + "</div>";

          "<div class='office-owned-row'><div><strong>Transcribe new voicemails</strong><p>" + (available ? "New voicemails can include transcripts." : "New voicemail transcripts are unavailable.") + " Voicemail recording, delivery, and notifications remain separate.</p></div><div class='setting-meta'>" + badge("Inherited from " + office.name, "inherited") + "</div></div></section>";
      }

      function officeOptions(selected) {

      function renderGroupList(type) {

          var officeAi = officeMasterEffective(office);
          var sharingDisabled = !state.company.dataSharing || !office.dataSharing || !officeAi.on;

            "<td><div class='table-state" + (!parent.on ? " ai-disabled" : "") + "'>" + squareHtml("toggle-group-master", displayedValue, !parent.on, "AI availability for " + group.name + ". Controls Conversation AI; AI agents & assistants follow the Office setting.", "data-type='" + type + "' data-group='" + group.id + "'") + "<small>" + esc(source) + "</small></div></td>" +
            "<td><div class='management-control" + (managementDisabled ? " ai-disabled" : "") + "'>" + squareHtml("toggle-group-management", group.aiManagement, managementDisabled, "Allow " + meta.singular + " admins to manage AI settings for " + group.name, "data-type='" + type + "' data-group='" + group.id + "'") + managementState + "</div></td>" +
            "<td><div class='office-setting-control" + (sharingDisabled ? " ai-disabled" : "") + "'>" + squareHtml("toggle-group-data-sharing", group.dataSharing, sharingDisabled, sharingLabel, "data-type='" + type + "' data-group='" + group.id + "'") + "<span class='office-setting-state'>" + (group.dataSharing ? "On" : "Off") + "</span></div></td></tr>";

          "<div class='table-footer'><span>Show <select class='select'><option>25</option></select></span><span>" + (groups.length ? "Showing 1–" + groups.length + " of " + groups.length : "Showing 0 of 0") + "</span></div>";
      }

      function groupAiHtml(type, group, options) {
        options = options || {};
        var office = getOffice(group.officeId);
        var managementLock = options.centralized ? null : aiManagementLockFor(type, group);
        var parent = officeFamilyEffective(office, "conversation");

          "<div class='setting-row" + (disabled ? " ai-disabled" : "") + "'><div class='setting-copy'><strong>Share eligible conversation data with Dialpad</strong><p>Allow Dialpad to use eligible conversation data from this " + TYPES[type].singular.toLowerCase() + " to improve transcription accuracy and generative AI quality. This choice does not affect AI access. It remains saved when Conversation AI is off and becomes editable again when AI is available.</p>" + meta + "</div>" +
          switchHtml("toggle-group-data-sharing", group.dataSharing, disabled, "Share eligible conversation data for " + group.name, "data-type='" + type + "' data-group='" + group.id + "'") + "</div></section>";

          "<div class='setting-row group-control-row'><div class='setting-copy'><strong>Configuration source</strong><p>" + (inherited ? "This group follows the Office preferences." : "This group uses its own saved preferences.") + "</p><div class='setting-meta'>" + modeBadge + unavailableMeta + "</div></div><div class='setting-actions'><button class='btn' data-action='" + modeAction + "' data-type='" + type + "' data-group='" + group.id + "' " + (!available ? "disabled aria-disabled='true'" : "") + ">" + modeLabel + "</button></div></div>" +
          "<div class='pii-options'>" + rows + "</div>" + noStartWarning + "</section>";

      function renderGroupDetail(type, group) {

      function guideDrawerHtml() {

      function centralGroupKey(type, id) { return type + ":" + id; }
      function bulkSelectionKeys(kind) { return kind === "offices" ? state.bulkSelection.officeIds : state.bulkSelection.groupKeys; }
      function bulkFilteredKeys(kind) {
        return kind === "offices"
          ? filteredCentralOffices().map(function (office) { return office.id; })
          : filteredCentralGroups().map(function (entry) { return centralGroupKey(entry.type, entry.group.id); });
      }
      function bulkPageKeys(kind) {
        return kind === "offices"
          ? centralOfficePage().items.map(function (office) { return office.id; })
          : centralGroupPage().items.map(function (entry) { return centralGroupKey(entry.type, entry.group.id); });
      }
      function bulkSelectionState(kind, keys) {
        if (!keys.length) return "false";
        var selected = bulkSelectionKeys(kind);
        var selectedCount = keys.filter(function (key) { return selected.indexOf(key) >= 0; }).length;
        return selectedCount === 0 ? "false" : selectedCount === keys.length ? "true" : "mixed";
      }
      function bulkFiltersActive(kind) {
        var filters = state.centralFilters;
        if (kind === "offices") return !!filters.officeQuery.trim() || filters.officeAvailability !== "all" || filters.officeManagement !== "all";
        return !!filters.groupQuery.trim() || filters.groupType !== "all" || filters.groupOffice !== "all" || filters.groupAvailability !== "all" || filters.groupManagement !== "all";
      }
      function bulkEntityLabel(kind, count) {
        if (kind === "offices") return count === 1 ? "Office" : "Offices";
        return count === 1 ? "Calling Group" : "Calling Groups";
      }
      function bulkAllLabel(kind) {
        var filteredCount = bulkFilteredKeys(kind).length;
        return "Update all " + filteredCount + (bulkFiltersActive(kind) ? " filtered " : " ") + bulkEntityLabel(kind, filteredCount);
      }
      function bulkAllButtonHtml(kind) {
        var filteredCount = bulkFilteredKeys(kind).length;
        var id = kind === "offices" ? "centralOfficeBulkAll" : "centralGroupBulkAll";
        var action = kind === "offices" ? "open-office-bulk-all" : "open-group-bulk-all";

      }
      function bulkToolbarHtml(kind) {
        var selected = bulkSelectionKeys(kind);
        var filtered = bulkFilteredKeys(kind);
        var selectedInView = selected.filter(function (key) { return filtered.indexOf(key) >= 0; }).length;
        var outside = selected.length - selectedInView;
        var id = kind === "offices" ? "centralOfficeBulkToolbar" : "centralGroupBulkToolbar";
        var selectedAction = kind === "offices" ? "open-office-bulk-selected" : "open-group-bulk-selected";
        var clearAction = kind === "offices" ? "clear-office-selection" : "clear-group-selection";
        if (!selected.length) return "<div class='central-bulk-toolbar' id='" + id + "' hidden></div>";
        var status = "<strong>" + selected.length + " selected</strong>" + (outside ? " · " + outside + " outside current filters" : "");
        return "<div class='central-bulk-toolbar has-selection' id='" + id + "' aria-live='polite'>" +
          "<span class='central-bulk-status'>" + status + "</span>" +
          "<button class='btn link' data-action='" + clearAction + "'>Clear</button>" +
          "<span class='central-bulk-spacer'></span>" +
          "<button class='btn primary' data-action='" + selectedAction + "'>Update selected</button>" +
        "</div>";
      }
      function syncBulkSelectionUi(kind) {
        var selected = bulkSelectionKeys(kind);
        var pageKeys = bulkPageKeys(kind);
        var pageAction = kind === "offices" ? "toggle-office-page-selection" : "toggle-group-page-selection";
        var rowAction = kind === "offices" ? "toggle-office-selection" : "toggle-group-selection";
        var header = document.querySelector("[data-action='" + pageAction + "']");
        if (header) {
          header.setAttribute("aria-checked", bulkSelectionState(kind, pageKeys));
          header.disabled = !pageKeys.length;
          if (pageKeys.length) header.removeAttribute("aria-disabled");
          else header.setAttribute("aria-disabled", "true");
        }
        document.querySelectorAll("[data-action='" + rowAction + "']").forEach(function (control) {
          var key = kind === "offices" ? control.getAttribute("data-office") : centralGroupKey(control.getAttribute("data-type"), control.getAttribute("data-group"));
          control.setAttribute("aria-checked", selected.indexOf(key) >= 0 ? "true" : "false");
        });
        var toolbar = document.getElementById(kind === "offices" ? "centralOfficeBulkToolbar" : "centralGroupBulkToolbar");
        if (toolbar) toolbar.outerHTML = bulkToolbarHtml(kind);
        var allButton = document.getElementById(kind === "offices" ? "centralOfficeBulkAll" : "centralGroupBulkAll");
        if (allButton) allButton.outerHTML = bulkAllButtonHtml(kind);
      }
      function toggleBulkSelection(kind, key) {
        var selected = bulkSelectionKeys(kind);
        var index = selected.indexOf(key);
        if (index >= 0) selected.splice(index, 1); else selected.push(key);
        syncBulkSelectionUi(kind);
      }
      function toggleBulkPageSelection(kind) {
        var selected = bulkSelectionKeys(kind);
        var pageKeys = bulkPageKeys(kind);
        var remove = pageKeys.length && pageKeys.every(function (key) { return selected.indexOf(key) >= 0; });
        pageKeys.forEach(function (key) {
          var index = selected.indexOf(key);
          if (remove && index >= 0) selected.splice(index, 1);
          else if (!remove && index < 0) selected.push(key);
        });
        syncBulkSelectionUi(kind);
      }
      function clearBulkSelection(kind) {
        if (kind === "offices") state.bulkSelection.officeIds = [];
        else state.bulkSelection.groupKeys = [];
        syncBulkSelectionUi(kind);
        var focusAction = kind === "offices" ? "open-office-bulk-all" : "open-group-bulk-all";
        var focusTarget = document.querySelector("[data-action='" + focusAction + "']");
        if (focusTarget) focusTarget.focus();
      }

      function officeAvailabilityKey(office) {
        var master = officeMasterEffective(office);

        var agentic = officeFamilyEffective(office, "agentic");
        if (!master.on || (!conversation.on && !agentic.on)) return "unavailable";
        if (!conversation.on || !agentic.on) return "restricted";
        return "available";

        "</tr>";

      function filteredCentralOffices() {
        var filters = state.centralFilters;

          var matchesAvailability = filters.officeAvailability === "all" || filters.officeAvailability === status;
          var matchesManagement = filters.officeManagement === "all" || (filters.officeManagement === "allowed" ? office.aiManagement : !office.aiManagement);
          return matchesQuery && matchesAvailability && matchesManagement;
        });
      }

      function centralOfficePage() {
        var offices = filteredCentralOffices();
        var filters = state.centralFilters;
        var pageSize = Number(filters.officePageSize) || 25;
        var pageCount = Math.max(1, Math.ceil(offices.length / pageSize));
        filters.officePage = Math.min(Math.max(1, Number(filters.officePage) || 1), pageCount);
        var startIndex = (filters.officePage - 1) * pageSize;
        return {
          items: offices.slice(startIndex, startIndex + pageSize),
          total: offices.length,
          page: filters.officePage,
          pageCount: pageCount,
          start: offices.length ? startIndex + 1 : 0,
          end: Math.min(startIndex + pageSize, offices.length)
        };

          "</div>" +
          bulkToolbarHtml("groups") +

      function groupEntryFromKey(key) {
        var separator = key.indexOf(":");
        if (separator < 0) return null;
        var type = key.slice(0, separator);
        var id = key.slice(separator + 1);
        var group = getGroup(type, id);
        if (!group) return null;
        return { key: key, name: group.name, type: type, group: group, office: getOffice(group.officeId) };
      }

      function bulkTargetEntries(request) {
        if (!request || !Array.isArray(request.keys)) return [];
        if (request.kind === "offices") {
          return request.keys.map(function (key) {
            var office = getOffice(key);
            return office ? { key: key, name: office.name, office: office } : null;
          }).filter(Boolean);
        }
        return request.keys.map(groupEntryFromKey).filter(Boolean);
      }

      function bulkTargetKeys(kind, mode) {
        return (mode === "selected" ? bulkSelectionKeys(kind) : bulkFilteredKeys(kind)).slice();
      }

      function bulkSettingOptions(kind) {
        if (kind === "offices") {
          return [
            { value: "aiMaster", label: "AI availability" },
            { value: "conversation", label: "Conversation AI", dependent: true },
            { value: "agentic", label: "AI Agents & Assistants", dependent: true },
            { value: "dataSharing", label: "Data sharing", dependent: true },
            { value: "aiManagement", label: "AI Management", independent: true, help: "Delegated admin access. Independent of AI availability." }
          ];
        }
        return [
          { value: "conversation", label: "Conversation AI" },
          { value: "dataSharing", label: "Data sharing", dependent: true },
          { value: "useOfficeDefault", label: "Use Office default" },
          { value: "aiManagement", label: "AI Management", independent: true, help: "Delegated admin access. Independent of Conversation AI." }
        ];
      }

      function bulkSettingCurrentValue(request, setting, entry) {
        if (request.kind === "offices") {
          if (setting === "aiMaster") return !!entry.office.aiMaster;
          if (setting === "aiManagement") return !!entry.office.aiManagement;
          if (setting === "conversation" || setting === "agentic") return resolveLocal(entry.office[setting]);
          return !!entry.office.dataSharing;
        }
        if (setting === "useOfficeDefault") return entry.group.aiMaster === "inherit";
        if (setting === "conversation") return resolveLocal(entry.group.aiMaster);
        if (setting === "aiManagement") return !!entry.group.aiManagement;
        return !!entry.group.dataSharing;
      }

      function bulkSettingState(request, setting) {
        var entries = bulkTargetEntries(request);
        if (!entries.length) return "false";
        var first = bulkSettingCurrentValue(request, setting, entries[0]);
        var matches = entries.every(function (entry) { return bulkSettingCurrentValue(request, setting, entry) === first; });
        return matches ? (first ? "true" : "false") : "mixed";
      }

      function bulkRequestChanges(request) {
        return request && request.changes ? request.changes : {};
      }

      function bulkProjectedOfficeAvailability(request, office) {
        var value = bulkRequestChanges(request).aiMaster;
        return value ? value === "on" : !!office.aiMaster;
      }

      function bulkProjectedGroupAvailability(request, entry) {
        var changes = bulkRequestChanges(request);
        if (changes.useOfficeDefault === "inherit") return groupConversationWouldBeOn(entry.group, "inherit");
        if (changes.conversation) return changes.conversation === "on" && groupConversationWouldBeOn(entry.group, "allow");
        return groupMasterEffective(entry.type, entry.group).on;
      }

      function bulkToggleLabel(setting) {
        if (setting.value === "aiManagement") return setting.label + ". Checked means Allowed; unchecked means Locked.";
        return setting.label;
      }

      function bulkSettingLabel(setting) {
        var labels = {
          aiMaster: "AI availability",
          aiManagement: "AI Management",
          conversation: "Conversation AI",
          agentic: "AI Agents & Assistants",
          dataSharing: "Data sharing",
          useOfficeDefault: "Conversation AI"
        };
        return labels[setting] || "Setting";
      }

      function bulkValueLabel(setting, value) {
        if (setting === "aiManagement") return value === "allow" ? "Allowed" : "Locked";
        if (setting === "useOfficeDefault") return "Office default";
        return value === "on" ? "On" : "Off";
      }

      function bulkScopeTitle(request, lowerAll) {
        var count = request.keys.length;
        var label = bulkEntityLabel(request.kind, count);
        if (request.mode === "selected") return count + " selected " + label;
        return (lowerAll ? "all " : "All ") + count + (request.filtersActive ? " filtered " : " ") + label;

      function bulkScopeSummaryHtml(request) {
        var support = request.mode === "selected"
          ? "Only these selected rows will be evaluated, including selections outside the current view."
