        return "<div class='bulk-scope-summary'><strong>" + esc(bulkScopeTitle(request)) + "</strong>" + esc(support) + "</div>";
      }

      function officeBulkRestriction(office, setting, desired, request) {
        if (setting === "aiManagement") return "";
        if (setting === "aiMaster") {
          if (!state.company.aiMaster) return "Company AI is off";
          if (desired && !state.company.conversation && !state.company.agentic) return "No AI capabilities are available at Company level";
          return "";
        }
        if (setting === "conversation" || setting === "agentic") {
          if (!state.company.aiMaster) return "Company AI is off";
          if (!bulkProjectedOfficeAvailability(request, office)) return "AI availability is off for " + office.name;
          if (!state.company[setting]) return bulkSettingLabel(setting) + " is off at Company level";
          return "";
        }
        if (!state.company.dataSharing) return "Data sharing is off at Company level";
        if (!state.company.aiMaster) return "Company AI is off";
        if (!bulkProjectedOfficeAvailability(request, office)) return "AI availability is off for " + office.name;
        return "";
      }

      function groupBulkRestriction(entry, setting, request) {
        var office = entry.office;
        if (!office) return "Parent Office is unavailable";
        if (setting === "aiManagement") return office.aiManagement ? "" : "AI Management is locked by " + office.name;
        if (setting === "dataSharing") {
          if (!state.company.dataSharing) return "Data sharing is off at Company level";
          if (!office.dataSharing) return "Data sharing is off for " + office.name;
          if (!state.company.aiMaster) return "Company AI is off";
          if (!office.aiMaster) return "AI is off for " + office.name;
          if (!state.company.conversation) return "Conversation AI is off at Company level";
          if (!resolveLocal(office.conversation)) return "Conversation AI is off for " + office.name;
          if (!bulkProjectedGroupAvailability(request, entry)) return "Conversation AI is off for " + entry.group.name;
        } else {
          if (!state.company.aiMaster) return "Company AI is off";
          if (!office.aiMaster) return "AI is off for " + office.name;
          if (!state.company.conversation) return "Conversation AI is off at Company level";
          if (!resolveLocal(office.conversation)) return "Conversation AI is off for " + office.name;
        }
        return "";
      }

      function buildBulkPlan(request) {
        var plan = { changed: [], unchanged: [], skipped: [] };
        if (!request || !request.setting || !request.value) return plan;
        bulkTargetEntries(request).forEach(function (entry) {
          var current;
          var desired;
          if (request.kind === "offices") {
            current = bulkSettingCurrentValue(request, request.setting, entry);
            desired = request.setting === "aiManagement" ? request.value === "allow" : request.value === "on";
            var officeReason = officeBulkRestriction(entry.office, request.setting, desired, request);
            if (desired && officeReason) {
              entry.reason = officeReason;
              plan.skipped.push(entry);
              return;
            }
            if (current === desired) {
              plan.unchanged.push(entry);
              return;
            }
            if (officeReason) {
              entry.reason = officeReason;
              plan.skipped.push(entry);
            } else plan.changed.push(entry);
            return;
          }

          if (request.setting === "useOfficeDefault") {
            current = entry.group.aiMaster === "inherit";
            desired = true;
          } else if (request.setting === "conversation") {
            current = resolveLocal(entry.group.aiMaster);
            desired = request.value === "on";
          } else if (request.setting === "aiManagement") {
            current = !!entry.group.aiManagement;
            desired = request.value === "allow";
          } else {
            current = !!entry.group.dataSharing;
            desired = request.value === "on";
          }
          var groupReason = groupBulkRestriction(entry, request.setting, request);
          if (desired && request.setting !== "useOfficeDefault" && groupReason) {
            entry.reason = groupReason;
            plan.skipped.push(entry);
            return;
          }
          if (current === desired) {
            plan.unchanged.push(entry);
            return;
          }
          if (groupReason) {
            entry.reason = groupReason;
            plan.skipped.push(entry);
          } else plan.changed.push(entry);
        });
        return plan;
      }

      function bulkPlanSummaryHtml(plan) {
        var html = "<div class='bulk-plan-stats'><strong>" + plan.changed.length + " will change</strong><span>·</span><span>" + plan.unchanged.length + " already set</span><span>·</span><span>" + plan.skipped.length + " can’t be changed</span></div>";
        if (plan.skipped.length) {
          var visible = plan.skipped.slice(0, 8);
          html += "<details><summary>Why " + plan.skipped.length + " can’t be changed</summary><ul>" + visible.map(function (entry) {
            return "<li><strong>" + esc(entry.name) + ":</strong> " + esc(entry.reason) + "</li>";
          }).join("") + (plan.skipped.length > visible.length ? "<li>And " + (plan.skipped.length - visible.length) + " more.</li>" : "") + "</ul></details>";
        }
        return html;
      }

      function bulkChangeRequest(request, setting, value) {
        return {
          kind: request.kind,
          mode: request.mode,
          keys: request.keys.slice(),
          filtersActive: request.filtersActive,
          changes: clone(bulkRequestChanges(request)),
          setting: setting,
          value: value
        };
      }

      function buildBulkBatch(request) {
        var changes = bulkRequestChanges(request);
        var results = bulkSettingOptions(request.kind).filter(function (setting) {
          return Object.prototype.hasOwnProperty.call(changes, setting.value);
        }).map(function (setting) {
          var changeRequest = bulkChangeRequest(request, setting.value, changes[setting.value]);
          return { setting: setting.value, value: changes[setting.value], request: changeRequest, plan: buildBulkPlan(changeRequest) };
        });
        var changedEntries = [];
        var changedKeys = {};
        var unchangedCount = 0;
        var skippedCount = 0;
        results.forEach(function (result) {
          unchangedCount += result.plan.unchanged.length;
          skippedCount += result.plan.skipped.length;
          result.plan.changed.forEach(function (entry) {
            changedEntries.push({ setting: result.setting, value: result.value, entry: entry });
            changedKeys[entry.key] = true;
          });
        });
        return {
          results: results,
          changedEntries: changedEntries,
          changedCount: changedEntries.length,
          changedEntityCount: Object.keys(changedKeys).length,
          unchangedCount: unchangedCount,
          skippedCount: skippedCount
        };
      }

      function bulkBatchSummaryHtml(request, batch) {
        if (!batch.results.length) return "Change one or more toggles to preview this update.";
        var entityCount = batch.changedEntityCount;
        var entityLabel = bulkEntityLabel(request.kind, entityCount);
        var html = "<div class='bulk-plan-stats'><strong>" + batch.changedCount + " setting change" + (batch.changedCount === 1 ? "" : "s") + "</strong><span>across " + entityCount + " " + esc(entityLabel) + "</span><span>·</span><span>" + batch.unchangedCount + " already set</span><span>·</span><span>" + batch.skippedCount + " can’t be changed</span></div>";
        html += "<div class='bulk-plan-by-setting'>" + batch.results.map(function (result) {
          var value = bulkValueLabel(result.setting, result.value);
          return "<div class='bulk-plan-setting'><span><strong>" + esc(bulkSettingLabel(result.setting)) + ":</strong> " + esc(value) + "</span><span>" + result.plan.changed.length + " will change</span></div>";
        }).join("") + "</div>";
        if (batch.skippedCount) {
          var skipped = [];
          batch.results.forEach(function (result) {
            result.plan.skipped.forEach(function (entry) {
              skipped.push({ setting: result.setting, entry: entry });
            });
          });
          var visible = skipped.slice(0, 8);
          html += "<details><summary>Why " + batch.skippedCount + " can’t be changed</summary><ul>" + visible.map(function (item) {
            return "<li><strong>" + esc(bulkSettingLabel(item.setting)) + " — " + esc(item.entry.name) + ":</strong> " + esc(item.entry.reason) + "</li>";
          }).join("") + (skipped.length > visible.length ? "<li>And " + (skipped.length - visible.length) + " more.</li>" : "") + "</ul></details>";
        }
        return html;
      }

      function bulkProjectedOfficeCapability(request, office, family) {
        if (!state.company[family]) return false;
        var value = bulkRequestChanges(request)[family];
        return value ? value === "on" : resolveLocal(office[family]);
      }

      function bulkInvalidOfficeEnables(request, batch) {
        if (request.kind !== "offices") return [];
        var master = batch.results.find(function (result) { return result.setting === "aiMaster" && result.value === "on"; });
        if (!master) return [];
        return master.plan.changed.filter(function (entry) {
          return !bulkProjectedOfficeCapability(request, entry.office, "conversation") && !bulkProjectedOfficeCapability(request, entry.office, "agentic");
        });
      }

      function allBulkTargetsMatch(request, predicate) {
        var entries = bulkTargetEntries(request);
        return !!entries.length && entries.every(predicate);
      }

      function bulkSettingDisableReason(request, setting) {
        if (request.kind === "offices") {
          if (setting === "aiManagement") return "";
          if (!state.company.aiMaster) return "Company AI is off.";
          if (setting === "aiMaster") return "";
          if (setting === "conversation" && !state.company.conversation) return "Conversation AI is off at Company level.";
          if (setting === "agentic" && !state.company.agentic) return "AI Agents & Assistants is off at Company level.";
          if (setting === "dataSharing" && !state.company.dataSharing) return "Data sharing is off at Company level.";
          if (allBulkTargetsMatch(request, function (entry) { return !bulkProjectedOfficeAvailability(request, entry.office); })) return "Turn on AI availability in this update to change this setting.";
          return "";
        }
        if (setting === "aiManagement") {
          return allBulkTargetsMatch(request, function (entry) { return !entry.office || !entry.office.aiManagement; }) ? "Locked by parent Office policy." : "";
        }
        if (setting === "dataSharing") {
          if (!state.company.dataSharing) return "Data sharing is off at Company level.";
          if (allBulkTargetsMatch(request, function (entry) { return !entry.office || !entry.office.dataSharing; })) return "Data sharing is off for the selected parent Offices.";
          if (allBulkTargetsMatch(request, function (entry) { return !bulkProjectedGroupAvailability(request, entry); })) return "Turn on Conversation AI in this update to change Data sharing.";
          return "";
        }
        return allBulkTargetsMatch(request, function (entry) {
          return !entry.office || !officeFamilyEffective(entry.office, "conversation").on;
        }) ? "Unavailable under parent Office policy." : "";
      }

      function normalizeBulkChanges(request) {
        var changes = bulkRequestChanges(request);
        if (request.kind === "offices" && changes.aiMaster === "off") {
          delete changes.conversation;
          delete changes.agentic;
          delete changes.dataSharing;
        }
        if (request.kind === "groups" && changes.conversation === "off") delete changes.dataSharing;
      }

      function bulkActionRowsHtml(request) {
        return bulkSettingOptions(request.kind).map(function (setting) {
          var settingId = "bulk-setting-" + setting.value;
          var initialState = bulkSettingState(request, setting.value);
          var rowClass = "bulk-setting-row" + (setting.dependent ? " is-dependent" : "") + (setting.independent ? " is-independent" : "");
          var control = setting.value === "useOfficeDefault"
            ? "<button type='button' class='btn bulk-office-default-action' id='" + settingId + "' data-action='select-bulk-office-default' data-setting='useOfficeDefault' aria-label='Apply Use Office default' aria-pressed='false'>Apply</button>"
            : "<label class='bulk-toggle-control' for='" + settingId + "'><input type='checkbox' class='bulk-toggle-input' id='" + settingId + "'" + (initialState === "true" ? " checked" : "") + " aria-label='" + esc(bulkToggleLabel(setting)) + "' data-bulk-toggle='true' data-setting='" + setting.value + "' data-initial-state='" + initialState + "'><span class='switch bulk-setting-switch' aria-hidden='true'></span></label>";
          var clear = setting.value === "useOfficeDefault" ? "" : "<button type='button' class='bulk-setting-clear' data-action='clear-bulk-setting' data-setting='" + setting.value + "' aria-label='Undo change to " + esc(setting.label) + "' hidden>Undo</button>";
          return "<div class='" + rowClass + "' data-bulk-setting-row='" + setting.value + "'><span class='bulk-setting-copy'><span class='bulk-setting-name' id='" + settingId + "-label'>" + esc(setting.label) + "</span><small class='bulk-setting-help' data-bulk-setting-help='" + setting.value + "'>" + esc(setting.help || "") + "</small></span><span class='bulk-setting-control' aria-labelledby='" + settingId + "-label'>" + clear + control + "</span></div>";
        }).join("");
      }

      function openBulkEditor(kind, mode) {
        var keys = bulkTargetKeys(kind, mode);
        if (!keys.length) return;
        pendingBulkEdit = { kind: kind, mode: mode, keys: keys, filtersActive: bulkFiltersActive(kind), changes: {} };
        var body = "<p>Choose one or more settings to update together. Centered toggles mean the selected records have mixed values.</p>" +
          bulkScopeSummaryHtml(pendingBulkEdit) +
          "<fieldset class='bulk-setting-list'><legend class='visually-hidden'>Choose bulk updates</legend>" + bulkActionRowsHtml(pendingBulkEdit) + "</fieldset>" +
          "<div class='bulk-plan-summary' id='bulkPlanSummary' aria-live='polite'>Change one or more toggles to preview this update.</div>" +
          "<p class='modal-validation' id='bulkEditValidation' role='status' aria-live='polite' hidden></p>";
        openModal("Update " + bulkScopeTitle(pendingBulkEdit, true), body, "Review changes", "primary", function (request) {
          if (request) reviewBulkUpdate(request);
        }, "dialog", null, "bulk-setting-" + bulkSettingOptions(kind)[0].value);
        updateBulkEditor();
      }

      function chooseBulkOfficeDefault() {
        if (!pendingBulkEdit) return;
        if (pendingBulkEdit.changes.useOfficeDefault === "inherit") delete pendingBulkEdit.changes.useOfficeDefault;
        else {
          pendingBulkEdit.changes.useOfficeDefault = "inherit";
          delete pendingBulkEdit.changes.conversation;
        }
        updateBulkEditor();
      }

      function clearBulkSetting(setting) {
        if (!pendingBulkEdit) return;
        delete pendingBulkEdit.changes[setting];
        updateBulkEditor();
      }

      function updateBulkEditor() {
        if (!pendingBulkEdit) return;
        normalizeBulkChanges(pendingBulkEdit);
        var summary = document.getElementById("bulkPlanSummary");
        var validation = document.getElementById("bulkEditValidation");
        var confirmButton = document.getElementById("modalConfirmButton");
        var changes = pendingBulkEdit.changes;
        document.querySelectorAll("[data-bulk-toggle='true']").forEach(function (toggle) {
          var setting = toggle.getAttribute("data-setting");
          var selected = Object.prototype.hasOwnProperty.call(changes, setting);
          var stateValue = selected
            ? ((setting === "aiManagement" ? changes[setting] === "allow" : changes[setting] === "on") ? "true" : "false")
            : toggle.getAttribute("data-initial-state");
          var disabledReason = bulkSettingDisableReason(pendingBulkEdit, setting);
          toggle.indeterminate = stateValue === "mixed";
          toggle.checked = stateValue === "true";
          toggle.disabled = !!disabledReason;
          toggle.setAttribute("aria-disabled", disabledReason ? "true" : "false");
          var row = toggle.closest(".bulk-setting-row");
          row.classList.toggle("is-selected", selected);
          row.classList.toggle("is-disabled", !!disabledReason);
          var help = row.querySelector("[data-bulk-setting-help]");
          var option = bulkSettingOptions(pendingBulkEdit.kind).find(function (item) { return item.value === setting; });
          if (help) help.textContent = disabledReason || (option && option.help ? option.help : "");
          var clear = row.querySelector("[data-action='clear-bulk-setting']");
          if (clear) clear.hidden = !selected;
        });
        var officeDefault = document.querySelector("[data-action='select-bulk-office-default']");
        if (officeDefault) {
          var officeDefaultSelected = changes.useOfficeDefault === "inherit";
          var officeDefaultReason = bulkSettingDisableReason(pendingBulkEdit, "useOfficeDefault");
          officeDefault.setAttribute("aria-pressed", officeDefaultSelected ? "true" : "false");
          officeDefault.textContent = officeDefaultSelected ? "Undo" : "Apply";
          officeDefault.disabled = !!officeDefaultReason;
          officeDefault.setAttribute("aria-disabled", officeDefaultReason ? "true" : "false");
          var officeDefaultRow = officeDefault.closest(".bulk-setting-row");
          officeDefaultRow.classList.toggle("is-selected", officeDefaultSelected);
          officeDefaultRow.classList.toggle("is-disabled", !!officeDefaultReason);
          var officeDefaultHelp = officeDefaultRow.querySelector("[data-bulk-setting-help]");
          if (officeDefaultHelp) officeDefaultHelp.textContent = officeDefaultReason;
        }
        var batch = buildBulkBatch(pendingBulkEdit);
        var invalidOfficeEnables = bulkInvalidOfficeEnables(pendingBulkEdit, batch);
        if (summary) summary.innerHTML = bulkBatchSummaryHtml(pendingBulkEdit, batch);
        var ready = batch.results.length > 0;
        var valid = ready && batch.changedCount > 0 && invalidOfficeEnables.length === 0;
        if (confirmButton) {
          confirmButton.disabled = !valid;
          confirmButton.setAttribute("aria-disabled", valid ? "false" : "true");
        }
        if (validation) {
          validation.textContent = invalidOfficeEnables.length
            ? invalidOfficeEnables.length + " " + bulkEntityLabel("offices", invalidOfficeEnables.length) + " would have no available AI capability. Turn on Conversation AI or AI Agents & Assistants, or undo the AI availability change."
            : ready && !batch.changedCount ? "There are no eligible changes to review." : "";
          validation.hidden = !invalidOfficeEnables.length && (!ready || !!batch.changedCount);
        }
      }

      function bulkAuditEntryLabel(entry) {
        if (!entry.group) return entry.name;
        return entry.name + " (" + TYPES[entry.type].singular + ", " + entry.office.name + ")";
      }

      function bulkAuditDetails(plan) {
        return {
          changed: plan.changed.map(bulkAuditEntryLabel),
          unchanged: plan.unchanged.map(bulkAuditEntryLabel),
          skipped: plan.skipped.map(function (entry) { return { label: bulkAuditEntryLabel(entry), reason: entry.reason }; })
        };
      }

      function bulkAuditScope(request, plan) {
        var scope = bulkScopeTitle(request);
        if (!plan || !plan.changed.length) return scope;
        var labels = plan.changed.slice(0, 3).map(bulkAuditEntryLabel);
        return scope + " · " + labels.join(", ") + (plan.changed.length > labels.length ? " +" + (plan.changed.length - labels.length) + " more" : "");
      }

      function bulkSkippedSuffix(plan) {
        return plan.skipped.length ? " " + plan.skipped.length + " " + (plan.skipped.length === 1 ? "target was" : "targets were") + " skipped because parent policy or AI Management prevented the change." : "";
      }

      function bulkImpactCopy(request, plan) {
        var suffix = bulkSkippedSuffix(plan);
        if (request.setting === "aiManagement") return (request.value === "allow" ? "Delegated admins can now modify the affected settings." : "Delegated admins can still view saved settings but can no longer modify them.") + " AI availability and saved settings were unchanged." + suffix;
        if (request.setting === "dataSharing") return "The independent Data sharing choice changed without changing AI availability." + suffix;
        if (request.kind === "offices" && request.setting === "aiMaster") return "Office AI availability changed. Saved capability, Calling Group, Agent, deployment, Data sharing, PII, and voicemail settings were preserved and re-evaluated." + suffix;
        if (request.kind === "offices" && request.setting === "conversation") return "Conversation AI was re-evaluated across the affected Offices and Calling Groups. Saved child settings and independent policies were preserved." + suffix;
        if (request.kind === "offices" && request.setting === "agentic") return "AI Agent availability was re-evaluated across the affected Offices. Saved Agent, deployment, connector, permission, and independent settings were preserved." + suffix;
        if (request.setting === "useOfficeDefault") return "Conversation AI now follows each Calling Group’s parent Office. AI Agent assignments and independent settings were unchanged." + suffix;
        return "Conversation AI was re-evaluated. AI Agent assignments, Data sharing, default preferences, and saved dependent settings were unchanged." + suffix;
      }

      function applyBulkPlan(request) {
        var plan = buildBulkPlan(request);
        if (!plan.changed.length) {
          toast("No eligible settings changed.");
          return;
        }
        plan.changed.forEach(function (entry) {
          if (request.kind === "offices") {
            if (request.setting === "aiMaster") entry.office.aiMaster = request.value === "on";
            else if (request.setting === "aiManagement") entry.office.aiManagement = request.value === "allow";
            else if (request.setting === "conversation" || request.setting === "agentic") entry.office[request.setting] = request.value === "on" ? "inherit" : "block";
            else entry.office.dataSharing = request.value === "on";
          } else if (request.setting === "useOfficeDefault") entry.group.aiMaster = "inherit";
          else if (request.setting === "conversation") entry.group.aiMaster = request.value === "on" ? "allow" : "block";
          else if (request.setting === "aiManagement") entry.group.aiManagement = request.value === "allow";
          else entry.group.dataSharing = request.value === "on";
        });
        record(bulkSettingLabel(request.setting) + " (bulk)", bulkAuditScope(request, plan), "Multiple saved states", bulkValueLabel(request.setting, request.value), bulkImpactCopy(request, plan), bulkAuditDetails(plan));
        if (request.kind === "offices") state.bulkSelection.officeIds = [];
        else state.bulkSelection.groupKeys = [];
        render();
        successToast();
      }

      function applyBulkSettingResult(result) {
        result.plan.changed.forEach(function (entry) {
          if (result.request.kind === "offices") {
            if (result.setting === "aiMaster") entry.office.aiMaster = result.value === "on";
            else if (result.setting === "aiManagement") entry.office.aiManagement = result.value === "allow";
            else if (result.setting === "conversation" || result.setting === "agentic") entry.office[result.setting] = result.value === "on" ? "inherit" : "block";
            else entry.office.dataSharing = result.value === "on";
          } else if (result.setting === "useOfficeDefault") entry.group.aiMaster = "inherit";
          else if (result.setting === "conversation") entry.group.aiMaster = result.value === "on" ? "allow" : "block";
          else if (result.setting === "aiManagement") entry.group.aiManagement = result.value === "allow";
          else entry.group.dataSharing = result.value === "on";
        });
      }

      function bulkBatchAuditDetails(batch) {
        var changed = [];
        var unchanged = [];
        var skipped = [];
        batch.results.forEach(function (result) {
          var prefix = bulkSettingLabel(result.setting) + " — ";
          result.plan.changed.forEach(function (entry) { changed.push(prefix + bulkAuditEntryLabel(entry)); });
          result.plan.unchanged.forEach(function (entry) { unchanged.push(prefix + bulkAuditEntryLabel(entry)); });
          result.plan.skipped.forEach(function (entry) { skipped.push({ label: prefix + bulkAuditEntryLabel(entry), reason: entry.reason }); });
        });
        return { changed: changed, unchanged: unchanged, skipped: skipped };
      }

      function bulkBatchAuditScope(request, batch) {
        var labels = [];
        var seen = {};
        batch.changedEntries.forEach(function (item) {
          if (seen[item.entry.key]) return;
          seen[item.entry.key] = true;
          labels.push(bulkAuditEntryLabel(item.entry));
        });
        return bulkScopeTitle(request) + (labels.length ? " · " + labels.slice(0, 3).join(", ") + (labels.length > 3 ? " +" + (labels.length - 3) + " more" : "") : "");
      }

      function bulkBatchImpactCopy(request, batch) {
        var changedSettings = batch.results.filter(function (result) { return result.plan.changed.length; }).map(function (result) { return bulkSettingLabel(result.setting); });
        var impact = "Updated " + batch.changedCount + " saved setting" + (batch.changedCount === 1 ? "" : "s") + " across " + batch.changedEntityCount + " " + bulkEntityLabel(request.kind, batch.changedEntityCount) + ". ";
        if (changedSettings.indexOf("AI availability") >= 0 || changedSettings.indexOf("Conversation AI") >= 0) impact += "Dependent AI settings were re-evaluated without silently changing untouched saved choices. ";
        if (changedSettings.indexOf("AI Management") >= 0) impact += "AI Management changed delegated editing access independently of AI availability. ";
        if (batch.skippedCount) impact += batch.skippedCount + " ineligible setting change" + (batch.skippedCount === 1 ? " was" : "s were") + " skipped because of parent policy.";
        return impact.trim();
      }

      function applyBulkBatch(request) {
        var batch = buildBulkBatch(request);
        if (!batch.changedCount || bulkInvalidOfficeEnables(request, batch).length) {
          toast("No eligible settings changed.");
          return;
        }
        batch.results.forEach(applyBulkSettingResult);
        var outcomes = batch.results.filter(function (result) { return result.plan.changed.length; }).map(function (result) {
          return bulkSettingLabel(result.setting) + ": " + bulkValueLabel(result.setting, result.value);
        }).join("; ");
        record("AI settings (bulk)", bulkBatchAuditScope(request, batch), "Multiple saved states", outcomes, bulkBatchImpactCopy(request, batch), bulkBatchAuditDetails(batch));
        if (request.kind === "offices") state.bulkSelection.officeIds = [];
        else state.bulkSelection.groupKeys = [];
        render();
        successToast();
      }

      function bulkBatchEnablesGroupConversation(request, batch) {
        if (request.kind !== "groups") return false;
        return batch.results.some(function (result) {
          if (result.setting !== "conversation" && result.setting !== "useOfficeDefault") return false;
          return result.plan.changed.some(function (entry) {
            return !groupMasterEffective(entry.type, entry.group).on && bulkProjectedGroupAvailability(request, entry);
          });
        });
      }

      function bulkBatchDisablesGroupConversation(request, batch) {
        if (request.kind !== "groups") return false;
        return batch.results.some(function (result) {
          if (result.setting !== "conversation" && result.setting !== "useOfficeDefault") return false;
          return result.plan.changed.some(function (entry) {
            return groupMasterEffective(entry.type, entry.group).on && !bulkProjectedGroupAvailability(request, entry);
          });
        });
      }

      function bulkBatchIsDestructive(request, batch) {
        return batch.results.some(function (result) {
          return result.plan.changed.length && result.value === "off" && (result.setting === "aiMaster" || result.setting === "conversation" || result.setting === "agentic");
        }) || bulkBatchDisablesGroupConversation(request, batch);
      }

      function bulkBatchReviewHtml(request, batch) {
        var html = "<p>Review the settings that will change for eligible " + esc(bulkEntityLabel(request.kind, request.keys.length)) + ".</p><ul class='bulk-review-list'>";
        html += batch.results.map(function (result) {
          return "<li><strong>" + esc(bulkSettingLabel(result.setting)) + ": " + esc(bulkValueLabel(result.setting, result.value)) + "</strong> — " + result.plan.changed.length + " will change" + (result.plan.skipped.length ? "; " + result.plan.skipped.length + " can’t be changed" : "") + "</li>";
        }).join("") + "</ul>";
        if (batch.results.some(function (result) { return result.setting === "aiMaster" && result.value === "off" && result.plan.changed.length; })) {
          html += "<p class='modal-note'>Turning off AI availability makes Conversation AI and AI Agents &amp; Assistants unavailable, while preserving their saved choices. Data sharing and AI Management change only if selected above.</p>";
        } else if (batch.results.some(function (result) { return result.setting === "aiMaster" && result.value === "on" && result.plan.changed.length; })) {
          html += "<p class='modal-note'>Turning on AI availability re-evaluates the saved capability choices. Only settings selected above will be overwritten.</p>";
        }
        if (batch.results.some(function (result) { return result.setting === "conversation" && result.value === "off" && result.plan.changed.length; })) {
          html += "<p class='modal-note'>Conversation AI features, default preferences, and transcript PII redaction become inactive for the affected scopes. Saved choices remain available for restoration.</p>";
        }
        if (batch.results.some(function (result) { return result.setting === "agentic" && result.value === "off" && result.plan.changed.length; })) {
          html += "<p class='modal-note'>Linked AI Agent deployments stop accepting new conversations. Saved deployment and prerequisite settings are preserved.</p>";
        }
        if (batch.results.some(function (result) { return result.setting === "aiManagement" && result.plan.changed.length; })) {
          html += "<p class='modal-note'>AI Management affects delegated admin editing only; it does not turn AI on or off.</p>";
        }
        html += "<div class='bulk-plan-summary'>" + bulkBatchSummaryHtml(request, batch) + "</div>";
        return html;
      }

      function openBulkBatchConfirmation(request, batch) {
        var count = batch.changedEntityCount;
        var entityLabel = bulkEntityLabel(request.kind, count);
        var title = "Update AI settings for " + count + " " + entityLabel + "?";
        var confirmText = "Update " + count + " " + entityLabel;
        var body = bulkBatchReviewHtml(request, batch);
        if (bulkBatchEnablesGroupConversation(request, batch)) {
          openTranscriptionDisclaimer(title, confirmText, bulkBatchAuditScope(request, batch), "updating AI settings and enabling Conversation AI", function () { applyBulkBatch(request); }, "At least one eligible Calling Group will gain Conversation AI.", body);
          return;
        }
        openModal(title, body, confirmText, bulkBatchIsDestructive(request, batch) ? "danger" : "primary", function () { applyBulkBatch(request); });
      }

      function openBulkGenericConfirmation(request, plan) {
        var count = plan.changed.length;
        var entityLabel = bulkEntityLabel(request.kind, count);
        var actionCopy = request.setting === "useOfficeDefault"
          ? "Use each parent Office’s Conversation AI setting for the eligible Calling Groups."
          : "Set <strong>" + esc(bulkSettingLabel(request.setting)) + "</strong> to <strong>" + esc(bulkValueLabel(request.setting, request.value)) + "</strong> for the eligible " + esc(entityLabel) + ".";
        var body = "<p>" + actionCopy + "</p><div class='bulk-plan-summary'>" + bulkPlanSummaryHtml(plan) + "</div><p class='modal-note'>Other settings won’t change.</p>";
        openModal("Update " + count + " " + entityLabel + "?", body, "Update " + count + " " + entityLabel, "primary", function () { applyBulkPlan(request); });
      }

      function openBulkDestructiveConfirmation(request, plan) {
        var count = plan.changed.length;
        var entityLabel = bulkEntityLabel(request.kind, count);
        var scopedEntities = count === 1 ? "this " + entityLabel : "these " + entityLabel;
        var title;
        var body;
        var confirmText;
        if (request.kind === "offices" && request.setting === "aiMaster") {
          var groupCount = plan.changed.reduce(function (total, entry) { return total + groupsForOffice(entry.office.id).length; }, 0);
          var agentCount = plan.changed.reduce(function (total, entry) { return total + agentsForScope(entry.office.id).length; }, 0);
          title = "Turn off AI for " + count + " " + entityLabel + "?";
          confirmText = "Turn off AI for " + count + " " + entityLabel;
          body = "<p>Conversation AI and AI Agents &amp; Assistants will become unavailable throughout " + scopedEntities + ". Their Calling Groups and shared lines cannot override this setting.</p><ul><li>" + groupCount + " Calling Groups, " + count + " Main Lines, and " + agentCount + " linked Agent deployments will be re-evaluated</li><li>Saved Office, Calling Group, Agent, and deployment settings will be preserved</li><li>PII audio redaction, voicemail transcription, Data sharing, and AI Management will not change</li></ul>";
        } else if (request.kind === "offices" && request.setting === "conversation") {
          var conversationGroupCount = plan.changed.reduce(function (total, entry) { return total + groupsForOffice(entry.office.id).length; }, 0);
          title = "Turn off Conversation AI for " + count + " " + entityLabel + "?";
          confirmText = "Turn off Conversation AI";
          body = "<p>Conversation AI will be unavailable for calls and meetings in " + scopedEntities + ", including " + conversationGroupCount + " Calling Groups and their shared lines.</p><ul><li>Transcription, summaries and recaps, real-time assistance and coaching, and scorecards will be unavailable</li><li>PII redaction for AI transcripts becomes inactive; audio redaction is unchanged</li><li>AI Agents &amp; Assistants, voicemail transcription, Data sharing, and saved child settings will not change</li></ul>";
        } else if (request.kind === "offices") {
          var deploymentCount = plan.changed.reduce(function (total, entry) { return total + agentsForScope(entry.office.id).length; }, 0);
          title = "Turn off AI Agents & Assistants for " + count + " " + entityLabel + "?";
          confirmText = "Turn off AI Agents & Assistants";
          body = "<p>AI Agents &amp; Assistants will be unavailable throughout " + scopedEntities + ".</p><ul><li>" + deploymentCount + " linked Agent deployments will stop accepting new conversations</li><li>Saved Agent, deployment, connector, and permission settings will be preserved</li><li>Conversation AI, PII redaction, voicemail transcription, and Data sharing will not change</li></ul>";
        } else {
          var memberCount = plan.changed.reduce(function (total, entry) { return total + entry.group.members; }, 0);
          title = "Turn off Conversation AI for " + count + " " + entityLabel + "?";
          confirmText = "Turn off Conversation AI";
          body = "<p>Conversation AI will no longer be available for calls handled by " + scopedEntities + ", covering " + memberCount.toLocaleString() + " members or agents.</p><ul><li>Transcription, summaries, recaps, and real-time assistance will be unavailable</li><li>Default preferences and transcript PII redaction become inactive; saved choices are preserved</li><li>AI Agent assignments, audio PII redaction, voicemail transcription, and Data sharing will not change</li></ul>";
        }
        body += "<div class='bulk-plan-summary'>" + bulkPlanSummaryHtml(plan) + "</div>";
        openModal(title, body, confirmText, "danger", function () { applyBulkPlan(request); });
      }

      function bulkOfficeCapabilityWillBeAvailable(office, family, choice) {
        if (!state.company[family]) return false;
        if (choice === "keep") return resolveLocal(office[family]);
        return choice === "on";
      }

      function bulkOfficeEnableInvalidTargets(selection) {
        if (!selection || !selection.request) return [];

      function applyBulkOfficeEnable(selection) {
        var request = selection.request;
        var plan = buildBulkPlan(request);
        if (!plan.changed.length || bulkOfficeEnableInvalidTargets(selection).length) return;
        plan.changed.forEach(function (entry) {
          entry.office.aiMaster = true;
          if (state.company.conversation && selection.conversation !== "keep") entry.office.conversation = selection.conversation === "on" ? "inherit" : "block";
          if (state.company.agentic && selection.agentic !== "keep") entry.office.agentic = selection.agentic === "on" ? "inherit" : "block";
          if (state.company.dataSharing && selection.dataSharing !== "keep") entry.office.dataSharing = selection.dataSharing === "on";
        });
        var conversationSummary = selection.conversation === "keep" || !state.company.conversation ? "unchanged" : selection.conversation === "on" ? "On" : "Off";
        var agenticSummary = selection.agentic === "keep" || !state.company.agentic ? "unchanged" : selection.agentic === "on" ? "On" : "Off";
        var dataSummary = selection.dataSharing === "keep" || !state.company.dataSharing ? "unchanged" : selection.dataSharing === "on" ? "On" : "Off";
        record("AI availability (bulk)", bulkAuditScope(request, plan), "Off", "On", plan.changed.length + " " + bulkEntityLabel("offices", plan.changed.length) + " " + (plan.changed.length === 1 ? "was" : "were") + " enabled and saved child settings were re-evaluated. Conversation AI: " + conversationSummary + "; AI Agents & Assistants: " + agenticSummary + "; Data sharing: " + dataSummary + ". AI Management was unchanged." + bulkSkippedSuffix(plan), bulkAuditDetails(plan));

      function showManagementTooltip(target) {
        var tooltip = document.getElementById("managementTooltip");
        tooltip.textContent = target.getAttribute("data-management-tooltip");
        tooltip.hidden = false;
        var targetRect = target.getBoundingClientRect();
        var tooltipRect = tooltip.getBoundingClientRect();
        var left = Math.min(window.innerWidth - tooltipRect.width - 12, Math.max(12, targetRect.left));
        var top = targetRect.bottom + 8;
        if (top + tooltipRect.height > window.innerHeight - 12) top = targetRect.top - tooltipRect.height - 8;
        tooltip.style.left = left + "px";
        tooltip.style.top = Math.max(12, top) + "px";
      }

          var value = element.getAttribute(attribute);
          if (value) selector += "[" + attribute + "='" + value + "']";
        });
        return selector;

      function handlePii(action, target) {
        var groupType = target.getAttribute("data-type") || target.getAttribute("data-group-type") || (TYPES[state.route.entity] ? state.route.entity : null);
        var groupId = target.getAttribute("data-group") || (TYPES[state.route.entity] ? state.route.id : null);
        var group = groupId ? getGroup(groupType, groupId) : null;
        var routeGroup = TYPES[state.route.entity] ? getGroup(state.route.entity, state.route.id) : null;
        var office = getOffice(target.getAttribute("data-office")) || (group ? getOffice(group.officeId) : routeGroup ? getOffice(routeGroup.officeId) : state.route.entity === "offices" ? getOffice(state.route.id) : null);
        if (!office) return;
        var config = group ? group.pii : office.pii;
        if (action === "customize-group-pii") { group.pii = clone(office.pii); delete group.pii.mode; record("PII redaction", group.name, "Office default", "Custom", "The group now has its own saved PII configuration."); }
        else if (action === "restore-group-pii") { group.pii = null; record("PII redaction", group.name, "Custom", "Office default", "The stored group override was cleared."); }
        else if (action === "set-pii-mode") { var mode = target.getAttribute("data-mode"); if (office.pii.mode === mode) return; office.pii.mode = mode; record("PII inheritance", office.name, "Previous", mode, mode === "minimum" ? "Supported group overrides were re-evaluated against the proposed Office minimum." : "Current group customization behavior applies."); }
        else {
          if (group && !group.pii) return;
          config = group ? group.pii : office.pii;
          if (action === "toggle-pii" || action === "toggle-group-pii") config.enabled = !config.enabled;
          else if (action === "toggle-pii-artifact" || action === "toggle-group-pii-artifact") {
            var artifact = target.getAttribute("data-artifact");
            if (config[artifact] && (artifact === "transcripts" ? !config.audio : !config.transcripts)) { toast("Choose transcripts, audio recordings, or both."); return; }
            config[artifact] = !config[artifact];
          } else if (action === "toggle-pii-high") config.high = !config.high;

          }
          record("PII redaction", group ? group.name : office.name, "Previous", "Updated", "Transcript and audio effective states were re-evaluated independently.");
        }
        render();
        successToast();

      document.addEventListener("mouseover", function (event) {
        var target = event.target.closest("[data-management-tooltip]");
        if (target) showManagementTooltip(target);
      });
      document.addEventListener("mouseout", function (event) {
        var target = event.target.closest("[data-management-tooltip]");

      });
      document.addEventListener("focusin", function (event) {
        var target = event.target.closest("[data-management-tooltip]");
        if (target) showManagementTooltip(target);
      });
      document.addEventListener("focusout", function (event) {
        if (event.target.closest("[data-management-tooltip]")) hideManagementTooltip();
      });
      document.addEventListener("click", function (event) {
        var target = event.target.closest("[data-action]");
        if (target && !target.disabled) { event.preventDefault(); handleClick(target); }
      });
      document.addEventListener("change", function (event) {
        var target = event.target;
        var companyEnableKey = target.getAttribute("data-company-enable");
        var officeEnableKey = target.getAttribute("data-office-enable");
        var bulkOfficeEnableKey = target.getAttribute("data-bulk-office-enable");

            disclaimerConfirmButton.disabled = !target.checked;
            disclaimerConfirmButton.setAttribute("aria-disabled", target.checked ? "false" : "true");
          }

          pendingCompanyEnable[companyEnableKey] = target.checked;
          updateCompanyEnableValidation();
        } else if (officeEnableKey && pendingOfficeEnable && Object.prototype.hasOwnProperty.call(pendingOfficeEnable, officeEnableKey)) {
          pendingOfficeEnable[officeEnableKey] = target.checked;
          updateOfficeEnableValidation();
        } else if (bulkOfficeEnableKey && pendingBulkOfficeEnable && Object.prototype.hasOwnProperty.call(pendingBulkOfficeEnable, bulkOfficeEnableKey)) {
          pendingBulkOfficeEnable[bulkOfficeEnableKey] = target.value;
          updateBulkOfficeEnableValidation();
        } else if (target.getAttribute("data-bulk-office-enable-data") === "true" && pendingBulkOfficeEnable) {
          pendingBulkOfficeEnable.dataSharing = target.value;
        } else if (target.getAttribute("data-bulk-toggle") === "true" && pendingBulkEdit) {
          var bulkSetting = target.getAttribute("data-setting");
          var bulkInitialState = target.getAttribute("data-initial-state");
          var bulkValue = bulkSetting === "aiManagement"
            ? (target.checked ? "allow" : "lock")
            : (target.checked ? "on" : "off");
          target.indeterminate = false;
          if (bulkInitialState !== "mixed" && target.checked === (bulkInitialState === "true")) delete pendingBulkEdit.changes[bulkSetting];
          else pendingBulkEdit.changes[bulkSetting] = bulkValue;
          if (bulkSetting === "conversation") delete pendingBulkEdit.changes.useOfficeDefault;
          if (pendingBulkEdit.kind === "offices" && bulkSetting === "aiMaster" && bulkValue === "off") {
            delete pendingBulkEdit.changes.conversation;
            delete pendingBulkEdit.changes.agentic;
            delete pendingBulkEdit.changes.dataSharing;
          }
          if (pendingBulkEdit.kind === "groups" && bulkSetting === "conversation" && bulkValue === "off") delete pendingBulkEdit.changes.dataSharing;
          updateBulkEditor();
        } else if (target.getAttribute("data-action") === "central-office-availability") {
          state.centralFilters.officeAvailability = target.value;
          state.centralFilters.officePage = 1;
          updateCentralOfficeResults();
        } else if (target.getAttribute("data-action") === "central-office-management") {
          state.centralFilters.officeManagement = target.value;
          state.centralFilters.officePage = 1;
          updateCentralOfficeResults();
        } else if (target.getAttribute("data-action") === "central-office-page-size") {
          state.centralFilters.officePageSize = Number(target.value);
          state.centralFilters.officePage = 1;
          updateCentralOfficeResults();
        } else if (target.getAttribute("data-action") === "central-group-type") {
          state.centralFilters.groupType = target.value;
          state.centralFilters.groupPage = 1;
          updateCentralGroupResults();
        } else if (target.getAttribute("data-action") === "central-group-office") {
          state.centralFilters.groupOffice = target.value;
          state.centralFilters.groupPage = 1;
          updateCentralGroupResults();
        } else if (target.getAttribute("data-action") === "central-group-availability") {
          state.centralFilters.groupAvailability = target.value;
          state.centralFilters.groupPage = 1;
          updateCentralGroupResults();
        } else if (target.getAttribute("data-action") === "central-group-management") {
          state.centralFilters.groupManagement = target.value;
          state.centralFilters.groupPage = 1;

        else if (target.getAttribute("data-action") === "dictionary-language") { state.dictionaryFilters.language = target.value; updateDictionaryResults(); }

      function trapFocusWithin(event, container) {
        var focusable = Array.prototype.filter.call(container.querySelectorAll("a[href], button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex='-1'])"), function (element) {

          event.preventDefault();
          last.focus();

      document.addEventListener("keydown", function (event) {

          var currentIndex = tabIds.indexOf(centralTab.getAttribute("data-tab"));

      var initial = parseHash();

      render();

  </script>
